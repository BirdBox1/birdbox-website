<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaching Self-Assessment — BirdBox Coaching</title>
<meta name="description" content="Twelve questions, two minutes. Find out which stage of the coaching journey you are in, and what to work on next.">
<meta property="og:title" content="What kind of coach are you?">
<meta property="og:description" content="Twelve questions, two minutes. Find your coaching stage and the one thing to work on next.">
<meta property="og:type" content="website">
<style>
  :root {
    --ink:    #eceae6;
    --paper:  #101215;
    --panel:  #191c20;
    --shell:  #0d0e10;
    --rule:   rgba(255,255,255,0.14);
    --muted:  #99a0a8;
    --accent: #2f7fd0;
    --good:   #6fbf87;
    --bad:    #e0736a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased;
  }

  .bar {
    background: var(--shell); padding: 0.7rem 1.25rem;
    display: flex; align-items: center; gap: 0.75rem;
    border-bottom: 1px solid var(--rule);
  }
  .mark { width: 32px; height: 32px; border-radius: 4px; background: #fff;
          display: grid; place-items: center; flex: none; }
  .mark img { width: 24px; height: 24px; object-fit: contain; }
  .bar .name { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1a9; }

  /* Language switcher. Quiet on purpose: the ad has already chosen the
     language, and this is only the way out when it chose wrong. */
  .langs { margin-left: auto; display: flex; gap: 0.1rem; }
  .langs button {
    background: none; border: 0; padding: 0.35rem 0.45rem; border-radius: 3px;
    font: inherit; font-size: 0.7rem; letter-spacing: 0.12em; color: #9aa1a9; cursor: pointer;
  }
  .langs button:hover { color: #fff; }
  .langs button[aria-current="true"] { color: #fff; box-shadow: inset 0 -2px 0 currentColor; }
  @media (max-width: 420px) { .langs button { padding: 0.35rem 0.28rem; letter-spacing: 0.06em; } }

  .wrap {
    max-width: 46rem; margin: 0 auto; padding: 0 1.25rem 5rem;
    transition: max-width 0.2s ease;
  }
  /* The result is a long read with a video in it, so it gets more room than
     the one-question-at-a-time screens do. */
  .wrap.wide { max-width: 54rem; }

  /* ---- progress ---- */
  .prog { height: 3px; background: rgba(255,255,255,0.08); margin: 0 0 2.2rem; }
  .prog__fill {
    height: 100%; width: 0; background: var(--accent);
    transition: width 0.28s ease;
  }
  .prog.hidden, .hidden { display: none !important; }

  /* ---- intro ---- */
  .lede { color: var(--muted); font-size: 1.02rem; }
  h1 {
    font-size: clamp(1.7rem, 5.5vw, 2.4rem); line-height: 1.12;
    letter-spacing: -0.025em; font-weight: 700; margin: 2.6rem 0 0.8rem;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.6rem 0 2rem; }
  .chips span {
    border: 1px solid var(--rule); border-radius: 4px; padding: 0.35rem 0.65rem;
    font-size: 0.84rem; color: var(--muted);
  }
  .btn {
    font: inherit; font-weight: 650; font-size: 0.92rem; cursor: pointer;
    letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0.95rem 1.7rem; border: 0; border-radius: 5px;
    background: var(--accent); color: #fff;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn[disabled] { opacity: 0.5; cursor: default; filter: none; }
  .btn--ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--rule);
  }
  .btn--ghost:hover { color: var(--ink); border-color: rgba(255,255,255,0.32); filter: none; }

  /* ---- questions ---- */
  .qcount {
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .qtext {
    font-size: clamp(1.25rem, 3.6vw, 1.55rem); line-height: 1.3;
    letter-spacing: -0.015em; font-weight: 650; margin: 0.5rem 0 1.5rem;
  }
  .opts { display: grid; gap: 0.65rem; }
  .opt {
    display: block; width: 100%; text-align: left; font: inherit;
    cursor: pointer; color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 6px;
    padding: 1rem 1.1rem; line-height: 1.45;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .opt:hover { border-color: rgba(255,255,255,0.34); background: #1e2227; }
  .opt.is-on { border-color: var(--accent); background: rgba(47,127,208,0.12); }
  .navrow { display: flex; align-items: center; gap: 0.8rem; margin-top: 1.6rem; }

  /* ---- details ---- */
  label.f { display: block; font-size: 0.78rem; font-weight: 650; margin: 0 0 0.3rem; }
  input[type=text], input[type=email] {
    width: 100%; font: inherit; font-size: 1rem;
    padding: 0.75rem 0.85rem; margin-bottom: 1rem;
    background: rgba(255,255,255,0.06); color: #fff;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 5px;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .two { display: grid; gap: 0 0.8rem; grid-template-columns: 1fr 1fr; }
  @media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
  .tick {
    display: flex; gap: 0.7rem; align-items: flex-start;
    font-size: 0.9rem; line-height: 1.5; margin: 0.4rem 0 1.4rem;
    color: var(--muted); cursor: pointer;
  }
  .tick input { width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; flex: none; }
  .said { font-size: 0.9rem; margin: 0.9rem 0 0; }
  .said.err { color: var(--bad); }

  /* ---- result ---- */
  .stage {
    margin: 1.6rem 0 1.8rem; padding: 1.1rem 1.3rem;
    background: var(--panel); border: 1px solid var(--rule);
    border-left: 4px solid var(--accent); border-radius: 5px;
  }
  .stage .k {
    font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .stage .v { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .result p { margin: 0 0 1rem; }
  .result ul { margin: 0 0 1.3rem; padding: 0; list-style: none; }
  .result li {
    padding: 0.4rem 0 0.4rem 1.35rem; position: relative;
    border-bottom: 1px solid var(--rule);
  }
  .result li::before {
    content: ""; position: absolute; left: 0; top: 1.1em;
    width: 0.7rem; height: 2px; background: var(--accent);
  }
  h2 {
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 2.2rem 0 0.7rem;
  }
  .video { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .nextstep {
    display: block; margin-top: 1.8rem; padding: 1.1rem 1.25rem;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
    color: var(--ink); text-decoration: none;
  }
  .nextstep:hover { border-color: rgba(255,255,255,0.32); }
  .nextstep .k {
    font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    display: block; margin-bottom: 0.2rem;
  }
  .nextstep .v { font-weight: 650; }
  .sent { color: var(--good); font-size: 0.92rem; margin-top: 1.6rem; }
  .secondask {
    margin-top: 2.2rem; padding: 1.4rem 1.5rem;
    background: var(--panel); border: 1px solid var(--rule);
    border-top: 3px solid var(--accent); border-radius: 6px;
  }
  .secondask .k {
    font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 0.4rem;
  }
  .secondask__lede { margin: 0 0 1.2rem; }

  footer {
    margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--rule);
    font-size: 0.82rem; color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<div class="bar">
  <span class="mark"><img src="/brand/birdBox.png" alt=""></span>
  <span class="name">BirdBox Coaching</span>
  <nav class="langs" id="langs" aria-label="Language"></nav>
</div>

<div class="wrap">
  <div class="prog hidden" id="prog"><div class="prog__fill" id="progfill"></div></div>

  <!-- ---------- intro ---------- -->
  <main id="intro">
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="chips">
      <span data-i18n="chip1"></span>
      <span data-i18n="chip2"></span>
      <span data-i18n="chip3"></span>
    </div>
    <button class="btn" type="button" id="start" data-i18n="start"></button>
  </main>

  <!-- ---------- questions ---------- -->
  <main id="quiz" class="hidden">
    <p class="qcount" id="qcount"></p>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="navrow">
      <button class="btn btn--ghost" type="button" id="back" data-i18n="back"></button>
    </div>
  </main>

  <!-- ---------- details ---------- -->
  <main id="details" class="hidden">
    <p class="qcount" data-i18n="almost"></p>
    <p class="qtext" data-i18n="whereSend"></p>
    <div class="two">
      <div>
        <label class="f" for="first" data-i18n="firstName"></label>
        <input id="first" type="text" autocomplete="given-name">
      </div>
      <div>
        <label class="f" for="last" data-i18n="lastName"></label>
        <input id="last" type="text" autocomplete="family-name">
      </div>
    </div>
    <label class="f" for="email" data-i18n="email"></label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label class="tick">
      <input id="consent" type="checkbox">
      <span data-i18n="consent"></span>
    </label>
    <button class="btn" type="button" id="finish" data-i18n="seeResult"></button>
    <p class="said" id="said"></p>
    <p class="said" style="color:var(--muted);margin-top:1.2rem" data-i18n="emailOnly"></p>
  </main>

  <!-- ---------- result ---------- -->
  <main id="result" class="hidden">
    <p class="qcount" data-i18n="resultHead"></p>
    <div class="stage">
      <span class="k" data-i18n="yourStage"></span>
      <div class="v" id="stagename"></div>
    </div>
    <div class="result" id="resultbody"></div>

    <h2 data-i18n="learnMore"></h2>
    <div class="video"><iframe id="video" title="Your stage" allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>

    <div class="result" id="resultclosing" style="margin-top:1.8rem"></div>

    <a class="nextstep" id="nextstep" href="/">
      <span class="k" data-i18n="nextStep"></span>
      <span class="v" id="nextsteptext"></span>
    </a>

    <p class="sent" id="sent"></p>

    <!-- Shown only to people who did not tick the box on the previous
         screen. By this point they know their stage, so the offer can name
         it — which is a far better ask than a generic newsletter box. -->
    <div class="secondask hidden" id="secondask">
      <p class="k" id="secondaskhead"></p>
      <p class="secondask__lede" id="secondasklede"></p>
      <button class="btn" type="button" id="secondaskgo" data-i18n="yesSend"></button>
      <p class="said" id="secondasksaid"></p>
    </div>
  </main>

  <footer>
    <p>BirdBox Coaching Limited · 19 Baggot Street Lower, Dublin 2, D02 X658, Ireland ·
      <a href="mailto:info@birdboxcoaching.com">info@birdboxcoaching.com</a></p>
  </footer>
</div>

<script src="/pixel.js"></script>
<script>
(function () {
  "use strict";

  // Twelve questions, four rungs of one ladder each, scored 1-4. The wording
  // is carried over from the JotForm this replaces. The score is recomputed
  // on the server from the raw answers — what is sent is only which option
  // was picked, never the result.
  // ---------------------------------------------------------------- strings
  // Every word on this page lives here, and nowhere else. English is built in
  // so the page works with no network beyond itself; any other language is a
  // file at /quiz/i18n/<lang>.json with the same keys, which is why adding a
  // language is one file rather than a copy of this page.
  var EN = {
    lang: "en",
    title: "What kind of coach are you right now?",
    lede: "Twelve questions about how you coach today. At the end you will get your current stage, what it means, and the one thing worth working on next.",
    chip1: "12 questions",
    chip2: "1\u20132 minutes",
    chip3: "Free",
    start: "Start the assessment",
    back: "Back",
    questionOf: "Question {n} of {total}",
    almost: "Almost there",
    whereSend: "Where should we send your result?",
    firstName: "First name",
    lastName: "Last name",
    email: "Email",
    consent: "Send me the follow-up information about my result today, plus the occasional newsletter with articles and podcasts to listen to. You can unsubscribe at any time.",
    seeResult: "See my result",
    emailOnly: "We use your email to send your result. Nothing else without the tick above.",
    needNames: "Both names, please.",
    needEmail: "We need a valid email address to send your result to.",
    working: "Working out your stage\u2026",
    failed: "That did not work. Please try again.",
    unreachable: "Could not reach us just then. Please try again.",
    resultHead: "Your coaching self-assessment",
    yourStage: "Your stage",
    learnMore: "Learn more on effective coaching",
    nextStep: "Your next step",
    emailed: "A copy is on its way to your inbox.",
    secondAskHead: "More for {plural}",
    secondAskLede: "Want more like this? We will send practical coaching content and the occasional course update, aimed at where you are now.",
    yesSend: "Yes, send it",
    saving: "Saving\u2026",
    saveFailed: "That did not save. Please try again.",
    saved: "Done \u2014 you are on the list.",
    questions: [
    { q: "How would you describe your current coaching system or approach?",
      a: ["I don’t really have one yet, I am still figuring it out.",
          "I have a system but I am still refining how to apply it.",
          "I have a system I trust but I’m working on making it more efficient.",
          "My system is dialed in and scales well across athletes or staff."] },
    { q: "When you watch someone move, what’s your first reaction?",
      a: ["I feel unsure about what to look for",
          "I can usually tell what’s wrong but not always why",
          "I can identify root causes and subtle compensations",
          "I can spot issues instantly and know how to coach them effectively"] },
    { q: "How do you apply educational content you’ve consumed (courses, seminars, videos)?",
      a: ["I watch a lot but don’t always use what I learn",
          "I try to apply things but struggle with consistency",
          "I’m selective, test ideas, and track what works",
          "I translate key insights into systems that work in real-time"] },
    { q: "How confident are you in giving movement cues or corrections?",
      a: ["I’m not confident yet — I often hesitate",
          "I give cues but often try several before one lands",
          "I know which cues to use, but I’m working on delivery and timing",
          "I can deliver precise cues that reliably create change"] },
    { q: "How do you know if your coaching is working?",
      a: ["I go mostly by how things feel or look",
          "I look for progress but don’t track it systematically",
          "I collect feedback and observe patterns to adjust",
          "I use specific markers and structured reflection to assess outcomes"] },
    { q: "What’s your biggest challenge right now?",
      a: ["I feel overwhelmed and don’t know where to start",
          "I want more consistency and confidence in my coaching",
          "I want to sharpen what I already do well",
          "I’m focused on scaling my impact and influence"] },
    { q: "How often do you seek feedback on your coaching or performance?",
      a: ["Rarely — I’m not sure who to ask or what to ask for",
          "Occasionally — I ask when things feel off",
          "Regularly — I have people I trust to give real feedback",
          "Continuously — I build feedback into my systems"] },
    { q: "When helping someone improve movement, what’s your approach?",
      a: ["I try a few things and see what sticks",
          "I follow a process but often adapt on the fly",
          "I use a structured approach but adjust based on nuance",
          "I use an efficient, tested process that creates reliable results"] },
    { q: "How clear are you on your coaching identity?",
      a: ["I’m still trying to figure out who I am as a coach",
          "I have a sense of my style but still compare myself to others",
          "I’m confident in my style and working on refining it",
          "I have a strong, unique voice as a coach and lead others with it"] },
    { q: "How do you prepare for coaching sessions or training design?",
      a: ["I often improvise or look for inspiration last-minute",
          "I prepare a plan but sometimes feel unsure about the details",
          "I use a consistent planning system but occasionally tweak things last-minute",
          "I follow a robust system that scales easily across clients or groups"] },
    { q: "What’s your approach to professional development right now?",
      a: ["I’m trying to absorb as much as I can",
          "I’m focused on applying what I learn in real situations",
          "I’m focused on refining what already works for me",
          "I’m focused on elevating others and scaling my systems"] },
    { q: "What describes your typical coaching conversation?",
      a: ["I give basic feedback or instructions and hope it helps",
          "I try to explain what’s wrong and offer options to improve",
          "I focus on asking better questions and drawing out ownership",
          "I coach the person, not just the performance, with clarity and purpose"] }
      ]
  };

  // The language comes from the path (/quiz/fr/) or ?lang=fr, and nothing
  // else. An unknown or missing language is English.
  var LANGS = ["en", "fr", "es", "de", "it", "pl", "pt"];
  function pickLang() {
    var m = /\/quiz\/([a-z]{2})\/?$/.exec(location.pathname);
    var q = new URLSearchParams(location.search).get("lang");
    var want = (m && m[1]) || (q || "").toLowerCase();
    return LANGS.indexOf(want) > 0 ? want : "en";
  }

  var S = EN;

  // A translation file only has to carry the keys it changes; anything it
  // leaves out falls back to the English above, so a half-finished
  // translation degrades to mixed language rather than to a blank page.
  async function loadStrings(lang) {
    if (lang === "en") return;
    try {
      var res = await fetch("/quiz/i18n/" + lang + ".json", { cache: "no-cache" });
      if (!res.ok) return;
      var t = await res.json();
      var merged = {};
      Object.keys(EN).forEach(function (k) { merged[k] = EN[k]; });
      Object.keys(t).forEach(function (k) {
        if (t[k] !== null && t[k] !== undefined && t[k] !== "") merged[k] = t[k];
      });
      if (!Array.isArray(merged.questions) || merged.questions.length !== EN.questions.length) {
        merged.questions = EN.questions;
      }
      S = merged;
      document.documentElement.lang = lang;
    } catch (e) {
      // Keep English rather than showing nothing.
    }
  }

  function applyStatic() {
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var v = S[el.getAttribute("data-i18n")];
      if (v) el.textContent = v;
    });
    if (S.metaTitle) document.title = S.metaTitle;
  }


  var $ = function (id) { return document.getElementById(id); };
  var answers = new Array(EN.questions.length).fill(null);
  var at = 0;

  // Where they came from, so a registration weeks later can be traced back
  // to the ad that started it.
  var params = new URLSearchParams(location.search);
  var utm = {
    source:   params.get("utm_source"),
    medium:   params.get("utm_medium"),
    campaign: params.get("utm_campaign"),
    content:  params.get("utm_content"),
    term:     params.get("utm_term")
  };

  function show(id) {
    $("langs").classList.toggle("hidden", id === "result");
    ["intro", "quiz", "details", "result"].forEach(function (s) {
      $(s).classList.toggle("hidden", s !== id);
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function progress(done) {
    $("prog").classList.remove("hidden");
    $("progfill").style.width = Math.round((done / (S.questions.length + 1)) * 100) + "%";
  }

  function paint() {
    var item = S.questions[at];
    $("qcount").textContent = S.questionOf
      .replace("{n}", at + 1).replace("{total}", S.questions.length);
    $("qtext").textContent = item.q;
    $("back").style.visibility = at === 0 ? "hidden" : "visible";

    var box = $("opts");
    box.textContent = "";
    item.a.forEach(function (text, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt" + (answers[at] === i + 1 ? " is-on" : "");
      b.textContent = text;
      b.addEventListener("click", function () {
        answers[at] = i + 1;
        // A short beat so the selection is visible before the next question.
        b.classList.add("is-on");
        setTimeout(next, 160);
      });
      box.append(b);
    });
    progress(at);
  }

  function next() {
    if (at < S.questions.length - 1) { at++; paint(); return; }
    progress(S.questions.length);
    show("details");
    $("first").focus();
  }

  $("start").addEventListener("click", function () { show("quiz"); paint(); });

  // Nothing is shown until the strings are settled, so a translated page
  // never flashes English first.

  // --------------------------------------------------------------- switcher
  // The ad sets the language through the address; this is the way out for
  // anyone it got wrong. Only languages with a finished, reviewed file are
  // offered, so nobody picks French and gets English. Add a code to LIVE
  // when its file lands.
  var LIVE = ["en", "fr", "de", "es", "it", "pt"];
  var NAMES = { en: "English", de: "Deutsch", es: "Español", it: "Italiano",
                fr: "Français", pl: "Polski", pt: "Português" };
  var BASE_TITLE = document.title;

  function renderLangs() {
    var nav = $("langs");
    nav.textContent = "";
    LIVE.forEach(function (code) {
      var b = document.createElement("button");
      b.type = "button";
      b.lang = code;
      b.textContent = code.toUpperCase();
      b.title = NAMES[code];
      b.setAttribute("aria-label", NAMES[code]);
      if (code === S.lang) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () { setLang(code); });
      nav.append(b);
    });
  }

  async function setLang(lang) {
    if (lang === S.lang) return;
    if (lang === "en") { S = EN; document.documentElement.lang = "en"; }
    else { await loadStrings(lang); if (S.lang !== lang) return; }

    applyStatic();
    if (!S.metaTitle) document.title = BASE_TITLE;
    // Answers are stored by position, not wording, so a coach can switch on
    // question 7 and carry on from question 7.
    if (!$("quiz").classList.contains("hidden")) paint();

    // Rewrite the address without reloading, so the answers so far stay put
    // and the UTM and Facebook parameters ride along untouched. A ?lang=
    // would overrule the path on a reload, so it goes.
    var q = new URLSearchParams(location.search);
    q.delete("lang");
    var p = location.pathname.replace(/index\.html$/, "");
    if (p.slice(-1) !== "/") p += "/";
    var base = p.replace(new RegExp("/(" + LANGS.join("|") + ")/$"), "/");
    var qs = q.toString();
    history.replaceState(null, "", base + (lang === "en" ? "" : lang + "/") +
      (qs ? "?" + qs : "") + location.hash);

    renderLangs();
  }

  loadStrings(pickLang()).then(function () { applyStatic(); renderLangs(); });
  $("back").addEventListener("click", function () { if (at > 0) { at--; paint(); } });

  $("finish").addEventListener("click", async function () {
    var said = $("said");
    var first = $("first").value.trim();
    var last = $("last").value.trim();
    var email = $("email").value.trim();

    if (!first || !last) {
      said.className = "said err"; said.textContent = S.needNames; return;
    }
    if (!email || !/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(email)) {
      said.className = "said err";
      said.textContent = S.needEmail;
      return;
    }

    $("finish").disabled = true;
    said.className = "said"; said.textContent = S.working;

    try {
      var res = await fetch("/.netlify/functions/quiz-submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          answers: answers,
          firstName: first,
          lastName: last,
          email: email,
          marketingConsent: $("consent").checked,
          lang: S.lang,
          // Whether the Meta pixel is allowed to run for this visitor.
          // consent.js decides: true after an explicit yes, and true outside
          // Europe where no yes is needed. If it is false the server reports
          // nothing to Meta either.
          pixelAllowed: !!(window.bbConsent && window.bbConsent.granted()),
          utm: utm,
          pageUrl: location.href,
          referer: document.referrer || null
        })
      });
      var data = await res.json();
      if (!res.ok || data.error) {
        said.className = "said err";
        // The server writes its errors in English, so other languages get the
        // page's own wording instead.
        said.textContent = (S.lang === "en" && data.error) || S.failed;
        $("finish").disabled = false;
        return;
      }
      render(data);
    } catch (e) {
      said.className = "said err";
      said.textContent = S.unreachable;
      $("finish").disabled = false;
    }
  });

  function paras(target, list) {
    list.forEach(function (t) {
      var p = document.createElement("p");
      p.textContent = t;
      target.append(p);
    });
  }

  function bullets(target, list) {
    if (!list || !list.length) return;
    var ul = document.createElement("ul");
    list.forEach(function (t) {
      var li = document.createElement("li");
      li.textContent = t;
      ul.append(li);
    });
    target.append(ul);
  }

  function render(data) {
    var r = data.result;

    $("stagename").textContent = r.name;

    var body = $("resultbody");
    body.textContent = "";
    paras(body, r.body);
    bullets(body, r.bullets);
    paras(body, r.after);
    bullets(body, r.bullets2);
    paras(body, r.after2);

    $("video").src = "https://www.youtube-nocookie.com/embed/" + r.videoId + "?rel=0";

    var closing = $("resultclosing");
    closing.textContent = "";
    paras(closing, r.closing);

    $("nextstep").href = r.next.href;
    $("nextsteptext").textContent = r.next.text;

    $("sent").textContent = data.emailed ? S.emailed : "";

    // The second ask, only for people who left the box unticked.
    if (!$("consent").checked && data.id) {
      $("secondaskhead").textContent =
        S.secondAskHead.replace("{plural}", r.name + (S.lang === "en" ? "s" : ""));
      $("secondasklede").textContent = S.secondAskLede;
      $("secondask").classList.remove("hidden");

      $("secondaskgo").addEventListener("click", async function () {
        var said = $("secondasksaid");
        $("secondaskgo").disabled = true;
        said.className = "said";
        said.textContent = S.saving;
        try {
          var res = await fetch("/.netlify/functions/quiz-consent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: data.id })
          });
          var out = await res.json();
          if (!res.ok || out.error) {
            said.className = "said err";
            said.textContent = (S.lang === "en" && out.error) || S.saveFailed;
            $("secondaskgo").disabled = false;
            return;
          }
          $("secondaskgo").classList.add("hidden");
          said.className = "sent";
          said.textContent = S.saved;
        } catch (e) {
          said.className = "said err";
          said.textContent = S.unreachable;
          $("secondaskgo").disabled = false;
        }
      });
    }

    $("prog").classList.add("hidden");
    document.querySelector(".wrap").classList.add("wide");
    show("result");

    // Meta counts this as the conversion, so ads can be optimised toward
    // completed assessments rather than clicks.
    //
    // The server has already reported the same Lead through the Conversions
    // API and handed back the id it used. Passing it here as eventID is what
    // stops the two being counted as two conversions — Meta keeps whichever
    // arrives first and discards the duplicate. No id means the pixel was
    // not allowed to run, in which case nothing is sent from either side.
    if (window.fbq && data.eventId) {
      window.fbq(
        "track",
        "Lead",
        { content_name: "Coaching self-assessment" },
        { eventID: data.eventId }
      );
    }
  }
})();
</script>

</body>
</html>
