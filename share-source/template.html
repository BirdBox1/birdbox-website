<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #14100F; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,11,12,.94) 0%, rgba(12,11,12,.82) 42%, rgba(12,11,12,.35) 75%, rgba(12,11,12,.15) 100%); }
  .glow { position: absolute; right: -120px; top: -80px; width: 760px; height: 760px; border-radius: 50%; filter: blur(90px); opacity: .32; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; }
  .bars { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; display: grid; grid-template-rows: repeat(4, 1fr); }
  .bars i:nth-child(1){background:#85151A}.bars i:nth-child(2){background:#298DE9}.bars i:nth-child(3){background:#10502C}.bars i:nth-child(4){background:#F1A509}
  .box { position: absolute; left: 76px; top: 64px; bottom: 58px; width: 690px; display: flex; flex-direction: column; }
  .logo { height: 70px; width: auto; align-self: flex-start; }
  .logo.tgc { height: 92px; }
  .logo.bird { height: 120px; }
  .mid { margin-top: auto; margin-bottom: auto; }
  .kick { font-size: 21px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; margin: 0 0 16px; }
  h1 { color: #F4F1EE; font-size: 70px; line-height: 1.02; letter-spacing: -.02em; font-weight: 800; margin: 0; text-wrap: balance; }
  h1.long { font-size: 58px; }
  .sub { color: #D3CDCF; font-size: 26px; line-height: 1.35; margin: 18px 0 0; max-width: 620px; }
  .site { color: #9a9396; font-size: 20px; letter-spacing: .06em; }
</style></head>
<body>
<div id="bg" class="bg"></div><div class="shade" id="shade"></div><div class="glow" id="glow"></div>
<div id="edge"></div>
<div class="box">
  <img id="logo" class="logo" src="" alt="">
  <div class="mid">
    <p class="kick" id="kick"></p>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="site">birdboxcoaching.com</div>
</div>
<script>
  var c = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  var COL = { tgc: "#F0797D", tcc: "#6FB9E8", tec: "#5FBE8A", twc: "#E5BC55", birdbox: "#6FB9E8", directory: "#6FB9E8" };
  // One strip in the section's own colour (the shades the site uses). BirdBox and
  // the Trainer Directory are BirdBox blue; no four-colour strip.
  var BAR = { tgc: "#D8393D", tcc: "#4FA8DE", tec: "#428F63", twc: "#D9A527", birdbox: "#4FA8DE", directory: "#4FA8DE" };
  var LOGO = { tgc: "/gift/card/logos/tgc.png", tcc: "/gift/card/logos/tcc.png", tec: "/gift/card/logos/tec.png", twc: "/gift/card/logos/twc.png", birdbox: "/brand/birdBox-silver.png", directory: "/brand/birdBox-silver.png" };
  var b = c.brand || "birdbox";
  if (c.photo) document.getElementById("bg").style.backgroundImage = "url('/" + c.photo + "')";
  else { document.getElementById("shade").style.display = "none"; }
  var glow = document.getElementById("glow");
  if (c.photo) glow.style.display = "none"; else glow.style.background = BAR[b];
  var edge = document.getElementById("edge");
  if (BAR[b]) { edge.className = "bar"; edge.style.background = BAR[b]; } else { edge.className = "bars"; edge.innerHTML = "<i></i><i></i><i></i><i></i>"; }
  var logo = document.getElementById("logo");
  logo.src = LOGO[b]; logo.classList.add(b === "birdbox" || b === "directory" ? "bird" : b);
  var k = document.getElementById("kick"); k.textContent = c.kick || ""; k.style.color = COL[b];
  var t = document.getElementById("title"); t.textContent = c.title; if (c.title.length > 26) t.classList.add("long");
  document.getElementById("sub").textContent = c.sub || "";
</script>
</body></html>
