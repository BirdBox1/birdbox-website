<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — BirdBox Coaching</title>
<meta name="description" content="Register for a BirdBox Coaching seminar or workshop.">
<style>
  :root {
    --ink:    #eceae6;
    --paper:  #101215;
    --panel:  #191c20;
    --shell:  #0d0e10;
    --rule:   rgba(255,255,255,0.14);
    --muted:  #99a0a8;
    --accent: #2f7fd0;
    --warn:   #e0a04a;
    --good:   #6fbf87;
    --bad:    #e0736a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased;
    position: relative; min-height: 100vh;
  }
  /* the photo itself */
  #wash {
    position: fixed; inset: 0; z-index: -2; opacity: 0.30;
    background: center 30% / cover no-repeat; pointer-events: none;
  }
  /* a colour laid over the photo, used where a template asks for one */
  #tint {
    position: fixed; inset: 0; z-index: -1; opacity: 0;
    background: var(--paper); pointer-events: none;
  }

  .bar {
    background: var(--shell); padding: 0.7rem 1.25rem;
    display: flex; align-items: center; gap: 0.75rem;
    border-bottom: 1px solid var(--rule);
  }
  .mark { width: 32px; height: 32px; border-radius: 4px; background: #fff;
          display: grid; place-items: center; flex: none; }
  .mark img { width: 24px; height: 24px; object-fit: contain; }
  .bar .name {
    font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1a9;
  }

  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem 5rem; }

  .head { padding: 2.4rem 0 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 0.8rem;
    background: rgba(255,255,255,0.08); border: 1px solid var(--rule); border-radius: 5px;
    padding: 0.6rem 1rem; font-size: 1.12rem; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 650; color: #fff;
  }
  .badge img { width: 44px; height: 44px; object-fit: contain; }

  /* a template can supply its own lockup, which replaces the badge */
  .lockup {
    display: block; max-width: 15rem; width: 55%; height: auto;
    filter: drop-shadow(0 2px 14px rgba(0,0,0,0.55));
  }

  /* workshops lead with the lockup, centred and large */
  .head.centred { text-align: center; padding-top: 2.8rem; }
  .head.centred .lockup {
    margin: 0 auto 0.4rem; width: 74%; max-width: 22rem;
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; }

  h1.shown {
    font-size: clamp(1.5rem, 4.6vw, 2.1rem); line-height: 1.15;
    letter-spacing: -0.02em; font-weight: 700; margin: 1.4rem 0 0.5rem;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }

  .facts {
    font-size: clamp(1.25rem, 3.4vw, 1.6rem); line-height: 1.25;
    letter-spacing: -0.015em; color: var(--ink); margin: 1.2rem 0 0.25rem;
    font-weight: 600; text-shadow: 0 2px 14px rgba(0,0,0,0.5);
  }
  .facts.place { color: var(--muted); font-weight: 500; margin: 0 0 0.25rem; }

  .buy {
    background: var(--panel);
    border: 1px solid var(--rule); border-top: 3px solid var(--brandcolour, var(--accent));
    border-radius: 6px; padding: 1.25rem; margin: 1.6rem 0 2rem;
  }
  .price { font-size: 1.9rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
  .price .was {
    font-size: 1.1rem; font-weight: 400; color: var(--muted);
    text-decoration: line-through; margin-right: 0.5rem;
  }
  .price small { display: block; font-size: 0.82rem; font-weight: 400; color: var(--good); letter-spacing: 0; margin-top: 0.2rem; }

  .prereq {
    border: 1px solid rgba(224,160,74,0.45);
    background: rgba(224,160,74,0.12);
    border-radius: 5px; padding: 0.75rem 0.9rem; margin: 1.1rem 0 0;
    font-size: 0.9rem; line-height: 1.5;
  }
  .prereq b {
    display: block; font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--warn); margin-bottom: 0.25rem;
  }

  .options { display: grid; gap: 0.7rem; margin-top: 1.15rem; }
  .opt {
    display: flex; align-items: center; gap: 0.9rem; width: 100%;
    font: inherit; text-align: left; cursor: pointer;
    background: transparent; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 5px; padding: 0.85rem 1rem;
  }
  .opt:hover { border-color: rgba(255,255,255,0.32); background: rgba(255,255,255,0.03); }
  .opt.primary {
    background: var(--brandcolour, var(--accent)); border-color: transparent; color: #fff;
  }
  .opt.primary:hover { filter: brightness(1.12); background: var(--brandcolour, var(--accent)); }
  .opt .label { font-weight: 650; }
  .opt .note { display: block; font-weight: 400; font-size: 0.86rem; color: var(--muted); margin-top: 0.1rem; }
  .opt.primary .note { color: rgba(255,255,255,0.82); }
  .opt .amount { margin-left: auto; font-weight: 650; white-space: nowrap; }
  .opt[disabled] { opacity: 0.45; cursor: default; filter: none; }

  .promo { margin-top: 1.15rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); }
  .promo-toggle {
    font: inherit; font-size: 0.9rem; color: var(--muted);
    background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline;
  }
  .promo-toggle:hover { color: var(--ink); }
  .promo-row { display: flex; gap: 0.6rem; margin-top: 0.7rem; }
  .promo-row input {
    flex: 1 1 auto; min-width: 0; font: inherit; font-size: 0.98rem;
    background: rgba(0,0,0,0.35); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 5px; padding: 0.7rem 0.85rem;
    text-transform: uppercase;
  }
  .promo-row input::placeholder { color: var(--muted); text-transform: none; }
  .promo-row button {
    font: inherit; font-weight: 650; cursor: pointer; white-space: nowrap;
    background: transparent; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 5px; padding: 0.7rem 1.1rem;
  }
  .promo-row button:hover { border-color: rgba(255,255,255,0.32); }
  .promo-msg { font-size: 0.88rem; margin: 0.6rem 0 0; }
  .promo-msg.ok { color: var(--good); }
  .promo-msg.err { color: var(--bad); }

  .seats { font-size: 0.9rem; color: var(--warn); font-weight: 600; margin: 0.9rem 0 0; }

  h2 {
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 2rem 0 0.6rem;
  }
  p { margin: 0 0 1rem; }

  .lede { font-size: 1.08rem; font-weight: 400; margin: 0 0 1.4rem; }

  .movements {
    border-left: 3px solid var(--brandcolour, var(--accent));
    padding: 0.15rem 0 0.15rem 0.9rem; margin: 0 0 1.25rem; font-size: 1.02rem;
  }

  ul.tick { list-style: none; margin: 0 0 1rem; padding: 0; }
  ul.tick li { padding: 0.35rem 0 0.35rem 1.35rem; position: relative; border-bottom: 1px solid var(--rule); }
  ul.tick li::before {
    content: ""; position: absolute; left: 0; top: 1.05em;
    width: 0.7rem; height: 2px; background: var(--brandcolour, var(--accent));
  }

  .spec { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0 0 1.4rem; }
  .spec span {
    border: 1px solid var(--rule); border-radius: 4px; padding: 0.32rem 0.6rem;
    font-size: 0.84rem; color: var(--muted); background: rgba(0,0,0,0.45);
    white-space: nowrap;
  }
  .spec b { color: var(--ink); font-weight: 650; }
  .spec img.ceu { width: 88px; height: 88px; object-fit: contain; }

  /* The video is not loaded until someone asks for it. Until then this
     is a still and a play button — no YouTube furniture, no request to
     Google, and nothing playing at people who did not ask. */
  .video {
    position: relative; aspect-ratio: 16 / 9; background: #000;
    border-radius: 6px; overflow: hidden;
  }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video .poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .video .play {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: grid; place-items: center; cursor: pointer;
    background: rgba(0,0,0,0.28); border: 0; padding: 0;
    transition: background 0.15s ease;
  }
  .video .play:hover { background: rgba(0,0,0,0.14); }
  .video .play svg {
    width: 4.6rem; height: 4.6rem;
    filter: drop-shadow(0 2px 12px rgba(0,0,0,0.55));
  }
  .video .play:hover svg { transform: scale(1.06); }
  .video .play svg { transition: transform 0.15s ease; }

  .detail {
    white-space: pre-line; font-size: 1rem; line-height: 1.6;
    margin: 0 0 1.25rem;
  }

  .venue {
    background: var(--panel);
    border: 1px solid var(--rule); border-radius: 6px; padding: 1rem 1.15rem;
  }
  .venue .top { display: flex; gap: 0.9rem; align-items: center; }
  .venue .top img {
    width: 84px; height: 84px; object-fit: cover; border-radius: 4px; flex: none; background: rgba(0,0,0,0.4);
  }
  .venue .vname { font-weight: 650; }
  .venue .vaddr { color: var(--muted); font-size: 0.92rem; }
  .map {
    margin-top: 0.9rem; border-radius: 4px; overflow: hidden;
    height: 170px; background: rgba(0,0,0,0.4);
  }
  .map iframe { width: 100%; height: 100%; border: 0; display: block; filter: grayscale(0.3); }
  .directions { display: inline-block; margin-top: 0.6rem; font-size: 0.88rem; color: var(--ink); }

  /* text sections sit on a veil so a busy photo cannot fight the words.
     Same width and padding as the buy box and the venue box. */
  .readable {
    background: rgba(0,0,0,0.45); border: 1px solid var(--rule);
    border-radius: 6px; padding: 1.25rem 1.25rem 0.35rem; margin: 1.6rem 0 0;
  }
  /* the panel supplies its own top padding, so the first heading
     inside it must not add another 2rem on top */
  .readable .first-inside h2 { margin-top: 0; }

  footer {
    margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--rule);
    font-size: 0.82rem; color: var(--muted);
  }
  footer a { color: var(--muted); }
  .msg { font-size: 0.9rem; margin: 0.9rem 0 0; }
  .msg.err { color: var(--bad); }

  .state { padding: 5rem 0; text-align: center; color: var(--muted); }
  .state h1 { font-size: 1.3rem; color: var(--ink); }
  .state a { color: var(--ink); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="wash"></div>
<div id="tint"></div>

<div class="bar">
  <span class="mark"><img src="/brand/birdBox.png" alt=""></span>
  <span class="name">BirdBox Coaching</span>
</div>

<div class="wrap">
  <div id="loading" class="state"><p>Loading…</p></div>

  <div id="missing" class="state hidden">
    <h1>This course is not available</h1>
    <p>It may have been removed, or the link may be wrong.<br>
       Please check the link, or contact
       <a href="mailto:info@birdboxcoaching.com">info@birdboxcoaching.com</a>.</p>
  </div>

  <main id="course" class="hidden">
    <div class="head" id="head">
