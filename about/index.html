<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About | BirdBox Coaching</title>
<meta name="description" content="BirdBox Coaching exists to raise the professional standard of coaching worldwide, through world-class education, practical experience and lifelong development.">
<style>
  :root {
    --paper: #14100F;
    --panel: #1C1719;
    --ink: #F2EFEF;
    --muted: #8A8385;
    --line: #342F31;
    --tcc: #4FA8DE;
    --accentText: #6FB9E8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }
  .bb-wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }

  .bb-topbar {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 28px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    position: relative; z-index: 3;
  }
  .bb-topbar a { color: #ADA6A8; text-decoration: none; }
  .bb-topbar a:hover { color: #ffffff; }

  .bb-backbar { padding: 12px 24px 0; max-width: 1320px; margin: 0 auto; width: 100%; }
  .bb-back {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 7px 15px; border: 1px solid var(--line); color: #ADA6A8;
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; text-decoration: none;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .bb-back:hover { color: #ffffff; border-color: var(--tcc); }

  /* ---------- team photo band ----------
     background-size: 100% auto means the photo always spans the full
     width, so nobody at the ends of the group is ever cropped. The
     band height then trims it vertically to heads-and-feet only, and
     background-position picks which slice of the photo that is. */
  .ab-shot {
    position: relative;
    width: 100%;
    aspect-ratio: 2.65 / 1;
    max-height: 54vh;
    background-color: var(--paper);
    background-image: url("/brand/4994E1B7-60A8-4FD1-9C36-14867A8F959B.jpeg");
    background-size: 100% auto;
    /* Vertical crop point. Lower % shows more sky, higher shows more floor. */
    background-position: center 58%;
    background-repeat: no-repeat;
    overflow: hidden;
  }
  /* Melts the photo into the page colour underneath, and darkens the
     top-left just enough for the mark to hold against bright sky. */
  .ab-shot::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg,
        rgba(20,16,15,0) 46%,
        rgba(20,16,15,0.55) 78%,
        rgba(20,16,15,0.94) 94%,
        rgba(20,16,15,1) 100%),
      linear-gradient(115deg,
        rgba(20,16,15,0.62) 0%,
        rgba(20,16,15,0.22) 22%,
        rgba(20,16,15,0) 44%);
  }
  .ab-shot__mark {
    position: absolute; top: 20px; left: 24px; z-index: 2;
    height: 78px; width: auto;
    filter: drop-shadow(0 2px 14px rgba(0,0,0,0.95));
  }
  .ab-shot__credit {
    position: absolute; right: 24px; bottom: 12px; z-index: 2;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(242,239,239,0.5); margin: 0;
  }

  /* ---------- hero copy bar ----------
     Two columns. The right column is pushed down so its first line
     sits level with the headline rather than with the eyebrow above it. */
  .tcc-hero { border-bottom: 1px solid var(--line); margin-top: -1px; }
  .tcc-hero__inner {
    max-width: 1320px; margin: 0 auto; padding: 4px 24px 34px;
    display: grid; grid-template-columns: 1.05fr 1fr; gap: 10px 48px;
    align-items: start;
  }
  .tcc-hero__copy { padding-top: 30px; }
  .tcc-hero__title {
    font-size: clamp(25px, 3.3vw, 42px); line-height: 1.05; font-weight: 800;
    letter-spacing: -0.015em; text-transform: uppercase; margin: 0;
  }
  .tcc-hero__title em { font-style: normal; color: var(--accentText); display: block; }
  .tcc-hero__lede {
    font-size: 15px; line-height: 1.6; color: #DCD7D8; margin: 0 0 12px;
  }
  .tcc-hero__strap {
    font-size: 12px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accentText); margin: 0 0 20px;
  }
  .tcc-cta {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 24px; background: var(--tcc); color: #0C1116;
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; text-decoration: none; border: 1px solid var(--tcc);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .tcc-cta:hover { background: transparent; color: var(--accentText); }
  .tcc-cta--ghost {
    background: transparent; color: var(--accentText); border-color: var(--line); margin-left: 10px;
  }
  .tcc-cta--ghost:hover { border-color: var(--tcc); color: #ffffff; background: transparent; }

  @media (max-width: 900px) {
    .tcc-hero__inner { grid-template-columns: 1fr; gap: 14px; padding-bottom: 30px; }
    .tcc-hero__copy { padding-top: 0; }
    .ab-shot { aspect-ratio: 2.2 / 1; max-height: none; }
    .ab-shot__mark { height: 58px; top: 14px; left: 16px; }
  }
  @media (max-width: 620px) {
    .tcc-cta--ghost { margin-left: 0; margin-top: 10px; }
    .ab-shot { aspect-ratio: 1.9 / 1; }
    .ab-shot__mark { height: 46px; }
    .ab-shot__credit { right: 14px; }
  }

  /* ---------- shared section furniture ---------- */
  .l1-section { padding: 40px 0 8px; }
  .l1-label {
    font-size: 11px; font-weight: 800; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accentText); margin: 0 0 8px;
  }
  .l1-h2 {
    font-size: clamp(20px, 2.6vw, 30px); font-weight: 800;
    letter-spacing: -0.01em; margin: 0 0 12px;
  }
  .l1-lede { font-size: 16px; line-height: 1.6; color: #C9C4C5; margin: 0 0 22px; max-width: 70ch; }
  .l1-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }
  .l1-two .l1-lede { max-width: none; margin-bottom: 0; }
  @media (max-width: 820px) { .l1-two { grid-template-columns: 1fr; } }

  .l1-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .l1-card { border: 1px solid var(--line); background: var(--panel); padding: 20px 22px; }
  .l1-card__title {
    font-size: 15px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.04em; margin: 0 0 8px;
  }
  .l1-card__text { font-size: 14px; line-height: 1.55; color: #C9C4C5; margin: 0; }

  .l1-pull {
    border-left: 3px solid var(--tcc);
    padding: 4px 0 4px 20px;
    margin-top: 22px;
  }
  .l1-pull h3 {
    font-size: 18px; font-weight: 800; text-transform: uppercase;
    letter-spacing: -0.01em; margin: 0 0 8px;
  }
  .l1-pull p { font-size: 15px; line-height: 1.6; color: #C9C4C5; margin: 0; max-width: 62ch; }

  /* ---------- photo band behind story and values ----------
     Same treatment as the Level 1 pages: a dark gradient sits over the
     photo so text stays legible. Panels inside stay opaque, so the
     photo reads in the gaps between them. */
  .ab-band {
    position: relative;
    border: 1px solid var(--line);
    padding: 8px 26px 30px;
    margin-top: 34px;
    background-image:
      linear-gradient(180deg, rgba(20,16,15,0.90) 0%, rgba(20,16,15,0.94) 100%),
      url("/brand/NG-6524.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .ab-band > .l1-section:first-child { padding-top: 30px; }
  @media (max-width: 620px) { .ab-band { padding: 4px 16px 20px; } }

  /* ---------- big statement band ---------- */
  .ab-statement {
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 44px 24px; margin: 44px 0 0; text-align: center;
  }
  .ab-statement p {
    font-size: clamp(19px, 2.8vw, 30px); font-weight: 800; line-height: 1.3;
    letter-spacing: -0.01em; margin: 0 auto; max-width: 24ch;
  }
  .ab-statement em { font-style: normal; color: var(--accentText); }

  /* ---------- values ---------- */
  .ab-values {
    display: grid; grid-template-columns: repeat(6, 1fr);
    border: 1px solid var(--line); background: var(--panel);
  }
  .ab-value {
    padding: 22px 18px; border-left: 1px solid var(--line); text-align: center;
  }
  .ab-value:first-child { border-left: none; }
  .ab-value__num {
    font-size: 12px; font-weight: 800; letter-spacing: 0.12em;
    color: var(--tcc); margin-bottom: 10px;
  }
  .ab-value__name {
    font-size: 14px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.04em; line-height: 1.25; margin: 0 0 8px;
  }
  .ab-value__text { font-size: 13px; line-height: 1.5; color: #B7B1B3; margin: 0; }
  @media (max-width: 1080px) {
    .ab-values { grid-template-columns: repeat(3, 1fr); }
    .ab-value:nth-child(3n + 1) { border-left: none; }
    .ab-value:nth-child(n + 4) { border-top: 1px solid var(--line); }
  }
  @media (max-width: 620px) {
    .ab-values { grid-template-columns: repeat(2, 1fr); }
    .ab-value:nth-child(3n + 1) { border-left: 1px solid var(--line); }
    .ab-value:nth-child(odd) { border-left: none; }
    .ab-value:nth-child(n + 3) { border-top: 1px solid var(--line); }
  }

  /* ---------- ripple ---------- */
  .ab-ripple {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    border: 1px solid var(--line); background: var(--panel); padding: 26px 20px;
  }
  .ab-stage { text-align: center; position: relative; padding: 0 6px; }
  .ab-stage::after {
    content: ""; position: absolute; top: 18px;
    left: calc(50% + 26px); right: calc(-50% + 26px);
    height: 1px; background: var(--line);
  }
  .ab-stage:last-child::after { display: none; }
  .ab-stage__dot {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 10px; font-size: 13px; font-weight: 800; color: #ADA6A8;
    position: relative; z-index: 1;
  }
  .ab-stage:last-child .ab-stage__dot { border-color: var(--tcc); color: var(--tcc); }
  .ab-stage__name {
    font-size: 12px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; margin: 0 0 6px;
  }
  .ab-stage:last-child .ab-stage__name { color: var(--accentText); }
  .ab-stage__text { font-size: 13px; line-height: 1.5; color: var(--muted); margin: 0; }
  @media (max-width: 820px) {
    .ab-ripple { grid-template-columns: repeat(2, 1fr); row-gap: 24px; }
    .ab-stage::after { display: none; }
  }

  /* ---------- ecosystem ---------- */
  .ab-brands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .ab-brand {
    border: 1px solid var(--line); background: var(--panel);
    padding: 22px 20px; display: flex; flex-direction: column;
    text-decoration: none; color: var(--ink);
    border-top: 3px solid var(--b);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .ab-brand:hover { background: #221C1E; border-color: var(--b); border-top-color: var(--b); }
  .ab-brand__code {
    font-size: 30px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--b); line-height: 1; margin-bottom: 6px;
  }
  .ab-brand__name {
    font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 14px;
  }
  .ab-brand__text { font-size: 14px; line-height: 1.55; color: #C9C4C5; margin: 0 0 18px; }
  .ab-brand__status {
    margin-top: auto; font-size: 11px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--b);
  }
  @media (max-width: 1000px) { .ab-brands { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) { .ab-brands { grid-template-columns: 1fr; } }

  /* ---------- founder ---------- */
  .ab-founder {
    display: grid; grid-template-columns: 380px 1fr; gap: 0;
    border: 1px solid var(--line); background: var(--panel); overflow: hidden;
  }
  .ab-founder__photo { width: 100%; height: 100%; object-fit: cover; min-height: 340px; }
  .ab-founder__body { padding: 28px 30px; }
  .ab-founder__quote {
    border-left: 3px solid var(--tcc); padding: 4px 0 4px 18px; margin: 20px 0 8px;
    font-size: 16px; line-height: 1.55; font-weight: 700; color: var(--accentText);
    max-width: 58ch;
  }
  .ab-founder__cite {
    font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    margin: 0 0 20px; padding-left: 21px;
  }
  @media (max-width: 900px) {
    .ab-founder { grid-template-columns: 1fr; }
    .ab-founder__photo { min-height: 300px; max-height: 420px; }
  }

  /* ---------- closing ---------- */
  .l1-close {
    border: 1px solid var(--line); background: var(--panel);
    padding: 34px 24px; text-align: center; margin-top: 28px;
  }
  .l1-close h2 {
    font-size: clamp(22px, 3vw, 32px); font-weight: 800;
    text-transform: uppercase; margin: 0 0 10px;
  }
  .l1-close p { font-size: 15px; color: #C9C4C5; margin: 0 0 20px; max-width: 60ch;
    margin-left: auto; margin-right: auto; }

  .tcc-cross {
    border: 1px solid var(--line); background: var(--panel);
    padding: 18px 22px; margin: 14px 0 0; text-align: center;
  }
  .tcc-cross__label {
    font-size: 11px; font-weight: 800; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
  }
  .tcc-cross__links { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 26px; }
  .tcc-cross__links a {
    font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    color: #C9C4C5; text-decoration: none;
  }
  .tcc-cross__links a:hover { color: var(--accentText); }

  .bb-footer {
    text-align: center; padding: 32px 24px 50px; font-size: 13px; color: #756F71;
    border-top: 1px solid var(--line); margin-top: 26px; line-height: 1.7;
  }
  .bb-footer a { color: #8A8385; text-decoration: none; }
  .bb-footer__staff {
    display: block; margin-top: 10px; font-size: 12px;
    letter-spacing: 0.06em; text-transform: uppercase;
  }

  @media (max-width: 1000px) {
    .l1-grid3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="bb-topbar">
  <a href="/merch">Merch Store</a>
  <a href="/blog">Blog</a>
  <a href="/trainer-directory">Trainer Directory</a>
  <a href="/about">About</a>
</nav>

<div class="bb-backbar">
  <a class="bb-back" href="/">&larr; All Pathways</a>
</div>

<div class="ab-shot" role="img" aria-label="The BirdBox Coaching team">
  <img class="ab-shot__mark" src="/brand/birdbox-mark.png" alt="BirdBox Coaching">
  <p class="ab-shot__credit">The BirdBox Coaching team</p>
</div>
