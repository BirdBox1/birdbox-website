<!DOCTYPE html>
<html lang="en">

  :root {

    --muted:  #6c7178;

    --good:   #1f8a54;

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  }

  .bar button:hover { color: #fff; border-color: #55595e; }

  .wrap { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  h2 { font-size: 1.15rem; letter-spacing: -0.015em; margin: 0 0 0.2rem; font-weight: 600; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }

  a.back {

  a.back:hover { text-decoration: underline; }

  }
  .btn:hover { background: #000; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  .msg { font-size: 0.85rem; margin-top: 0.9rem; min-height: 1.2em; }
  .msg.err { color: #b3261e; }
  .msg.ok  { color: var(--good); }

  .card {
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 5px; margin-bottom: 0.75rem;
  }
  .course {
    display: block; width: 100%; text-align: left; font: inherit;
    background: none; border: 0; padding: 1rem 1.1rem; cursor: pointer;
  }
  .course:hover { background: #faf9f7; }

  .course .top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem;
  }
  .course .title { font-weight: 650; letter-spacing: -0.01em; }
  .course .when { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
  .course .line { font-size: 0.85rem; color: var(--muted); margin-top: 0.15rem; }

  .pill {
    display: inline-block; font-size: 0.66rem; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 0.12rem 0.45rem;
    border: 1px solid var(--rule); border-radius: 2px; color: var(--muted);
    margin-right: 0.4rem;
  }
  .pill.brand { border-color: var(--accent); color: var(--accent); }
  .pill.full  { border-color: var(--warn);   color: var(--warn); }

  .attendee { padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--rule); }
  .attendee:last-child { border-bottom: 0; }
  .attendee .row1 {
    display: flex; align-items: center; gap: 0.75rem; justify-content: space-between;
  }
  .attendee .name { font-weight: 650; }
  .attendee .contact { font-size: 0.84rem; color: var(--muted); word-break: break-all; }
  .flags { margin-top: 0.35rem; }

  .check { display: flex; align-items: center; gap: 0.45rem; font-size: 0.85rem; cursor: pointer; }
  .check input { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }
