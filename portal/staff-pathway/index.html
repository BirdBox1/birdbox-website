<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Pathway — BirdBox Coaching</title>
<style>
  :root {
    --ink: #16181b; --paper: #f4f3f0; --card: #ffffff; --shell: #0d0e10; --rule: #e0ddd7;
    --muted: #6c7178; --accent: #85151A; --good: #1f8a54; --warn: #b4610f; --bad: #b3261e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  a { color: var(--accent); }

  .bar { background: var(--shell); color: #fff; padding: 0.7rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .bar .left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
  .mark { width: 34px; height: 34px; border-radius: 4px; background: #fff; display: grid; place-items: center; flex: none; }
  .mark img { width: 26px; height: 26px; object-fit: contain; display: block; }
  .bar .brandname { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1a9; white-space: nowrap; }
  .bar a.linkbtn { font: inherit; font-size: 0.8rem; background: none; color: #cfd4d9; border: 1px solid #33373c; padding: 0.3rem 0.7rem; border-radius: 3px; text-decoration: none; white-space: nowrap; }

  .wrap { max-width: 76rem; margin: 0 auto; padding: 1.25rem 1.25rem 4rem; }
  h1 { font-size: 1.4rem; letter-spacing: -0.02em; margin: 0 0 0.2rem; font-weight: 600; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.25rem; }
  .msg { font-size: 0.9rem; margin: 0.6rem 0; min-height: 1.2em; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--good); }

  .top { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .tabs button, .btn { font: inherit; font-size: 0.85rem; background: var(--card); color: var(--muted); border: 1px solid var(--rule); padding: 0.4rem 0.9rem; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tabs b { font-weight: 600; margin-left: 0.25rem; }
  .btn { border-radius: 4px; color: var(--ink); }
  .btn:hover { border-color: #b9b5ad; }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.bad { color: var(--bad); }
  .btn.small { font-size: 0.78rem; padding: 0.25rem 0.6rem; }
  .btn[disabled] { opacity: 0.6; cursor: wait; }
  input.search { font: inherit; font-size: 0.9rem; border: 1px solid var(--rule); border-radius: 4px; padding: 0.4rem 0.7rem; min-width: 14rem; margin-left: auto; }

  .list { display: flex; flex-direction: column; gap: 0.6rem; }
  .app { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; }
  .app.attn { border-color: #e9c48a; box-shadow: inset 4px 0 0 #e7a33a; }
  .head { padding: 0.9rem 1rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; cursor: pointer; }
  .name { font-weight: 650; font-size: 1.02rem; }
  .meta { color: var(--muted); font-size: 0.84rem; }
  .pill { display: inline-block; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 999px; padding: 0.08rem 0.5rem; color: var(--muted); white-space: nowrap; margin-left: 0.35rem; vertical-align: 2px; }
  .pill.st-accepted { color: var(--good); border-color: #bfe0cc; }
  .pill.st-new, .pill.st-reviewing, .pill.st-interview { color: var(--warn); border-color: #ecd2ad; }
  .pill.st-declined, .pill.st-withdrawn { color: var(--bad); border-color: #ecc4c0; }
  .pill.new { background: var(--bad); color: #fff; border-color: var(--bad); }
  .pill.cert { color: var(--good); border-color: #bfe0cc; }
  .pill.nocert { color: var(--warn); border-color: #ecd2ad; }
  .chev { color: var(--muted); font-size: 0.85rem; align-self: center; }

  .body { border-top: 1px solid var(--rule); padding: 1rem; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.25rem; }
  .body h3 { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 0.35rem; font-weight: 650; }
  .body h3:first-child { margin-top: 0; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 0.15rem 0.9rem; font-size: 0.88rem; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .written { white-space: pre-line; font-size: 0.92rem; background: var(--paper); padding: 0.8rem 0.9rem; border-radius: 4px; max-height: 26rem; overflow-y: auto; }
  .moves { list-style: none; padding: 0; margin: 0; font-size: 0.88rem; columns: 2; column-gap: 1rem; }
  .moves li { break-inside: avoid; padding: 0.1rem 0; }
  .moves li.grp { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 0.4rem; }
  .side { display: flex; flex-direction: column; gap: 0.5rem; }
  .side textarea, .side input { width: 100%; font: inherit; font-size: 0.88rem; border: 1px solid var(--rule); border-radius: 4px; padding: 0.45rem 0.55rem; }
  .side textarea { min-height: 6rem; resize: vertical; }
  .side textarea.decision { min-height: 11rem; }
  .row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .told { font-size: 0.86rem; background: var(--paper); border-radius: 4px; padding: 0.6rem 0.75rem; white-space: pre-line; }
  select.course { font: inherit; font-size: 0.85rem; border: 1px solid var(--rule); border-radius: 4px; padding: 0.4rem 0.6rem; background: var(--card); margin-left: auto; }
  select.course + input.search { margin-left: 0; }
  .tracker { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 0.8rem 1rem; margin-bottom: 1rem; }
  .tracker h2 { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.6rem; font-weight: 650; }
  .tracker .regions { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.6rem; }
  .tracker .r { border: 1px solid var(--rule); border-radius: 5px; padding: 0.55rem 0.7rem; }
  .tracker .r b { display: block; font-size: 0.9rem; }
  .tracker .r .n { font-size: 1.3rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tracker .r .n small { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
  .tracker .r .meta { font-size: 0.8rem; }
  .tracker .r.met { border-color: #bfe0cc; background: #f3faf6; }
  .empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); background: var(--card); border: 1px solid var(--rule); border-radius: 6px; }
  .gate { max-width: 26rem; margin: 4rem auto; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 1.5rem; text-align: center; }


  .player { position: fixed; inset: 0; z-index: 300; background: rgba(8,9,10,0.82); display: flex; align-items: center; justify-content: center; padding: 1.25rem; }
  .pl-box { width: min(72rem, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 0.6rem; }
  .pl-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; color: #fff; }
  .pl-top b { font-weight: 600; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-acts { display: flex; gap: 0.8rem; align-items: center; flex: none; }
  .pl-acts a { color: #cfd4d9; font-size: 0.85rem; }
  #pl-close { font: inherit; font-size: 1.1rem; background: none; border: 1px solid #55595e; color: #fff; border-radius: 4px; width: 2.2rem; height: 2.2rem; cursor: pointer; }
  .pl-stage { background: #000; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 12rem; }
  .pl-stage video { display: block; width: 100%; max-height: calc(100vh - 9rem); background: #000; }
  .pl-stage iframe { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 9rem); border: 0; }
  .pl-stage iframe.doc { aspect-ratio: auto; height: calc(100vh - 9rem); background: #fff; }
  .pl-stage .pl-msg { color: #cfd4d9; padding: 2.5rem 1.5rem; text-align: center; font-size: 0.95rem; }
  .pl-stage .pl-msg a { color: #fff; }
  .pl-nav { display: flex; justify-content: space-between; align-items: center; color: #9aa1a9; font-size: 0.85rem; }
  .pl-nav .btn[disabled] { opacity: 0.35; cursor: default; }
  @media (max-width: 46rem) { .player { padding: 0.5rem; } }
  @media (max-width: 46rem) {
    .wrap { padding: 1rem 0.75rem 3rem; }
    .body { grid-template-columns: 1fr; }
    .moves { columns: 1; }
    input.search { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="bar">
  <span class="left">
    <span class="mark"><img src="/brand/birdBox.png" alt=""></span>
    <span class="brandname">Staff Pathway</span>
  </span>
  <span class="right"><a class="linkbtn" href="/portal/">Back to portal</a></span>
</div>

<section id="view-gate" class="gate hidden"><p id="gate-text">Checking your access…</p></section>

<section id="view-main" class="wrap hidden">
  <h1>Staff Pathway applications</h1>
  <p class="sub">Applications for the year of mentorship. Accepting or declining emails the applicant your message; declined applicants can apply again after six months. <a href="/tgc/staff-pathway/" target="_blank">Open the application page ↗</a></p>

  <div class="top">
    <div class="tabs" id="tabs">
      <button type="button" data-tab="open" class="on">To review<b id="n-open"></b></button>
      <button type="button" data-tab="accepted">Accepted<b id="n-accepted"></b></button>
      <button type="button" data-tab="declined">Not this time<b id="n-declined"></b></button>
      <button type="button" data-tab="all">Everyone<b id="n-all"></b></button>
    </div>
    <select id="course" class="course" aria-label="Course">
      <option value="all">All courses</option>
      <option value="tgc">TGC Staff Pathway</option>
      <option value="tec">TEC Founding Staff</option>
    </select>
    <input class="search" id="q" type="search" placeholder="Search name, email, country">
  </div>

  <div class="tracker hidden" id="tracker"></div>
  <div class="msg" id="msg"></div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</section>

<div class="player hidden" id="player" role="dialog" aria-modal="true" aria-labelledby="pl-title">
  <div class="pl-box">
    <div class="pl-top">
      <b id="pl-title"></b>
      <span class="pl-acts"><a id="pl-out" href="#" target="_blank" rel="noopener">Open in new tab ↗</a><button type="button" id="pl-close" aria-label="Close">✕</button></span>
    </div>
    <div class="pl-stage" id="pl-stage"></div>
    <div class="pl-nav">
      <button type="button" class="btn small" id="pl-prev">← Previous</button>
      <span id="pl-count"></span>
      <button type="button" class="btn small" id="pl-next">Next →</button>
    </div>
  </div>
</div>

<script type="module" src="/portal/menu.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const db = createClient("https://yvdmazpxtpuvidlcifnq.supabase.co", "sb_publishable_GOrQSPEuHhbKLQMgqsATvg_rKpro7uZ");
const $ = (id) => document.getElementById(id);
const esc = (s) => (s == null ? "" : String(s).replace(/[<>&"]/g, (m) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[m])));
const show = (w) => { $("view-gate").classList.toggle("hidden", w !== "gate"); $("view-main").classList.toggle("hidden", w !== "main"); };
const gate = (html) => { $("gate-text").innerHTML = html; show("gate"); };
const say = (t, k = "") => { $("msg").className = "msg " + k; $("msg").textContent = t; };
const day = (d) => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const link = (u, label) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(label || "Watch ↗")}</a>` : '<span class="meta">none</span>';
// A video or document that opens in the player on this page. The link
// still works as a plain new-tab link if the player cannot show it.
const play = (u, label, title) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener" data-play data-title="${esc(title || label)}">${esc(label)}</a>` : '<span class="meta">none</span>';

const STATUS = { new: "To review", reviewing: "Reviewing", interview: "Interview", accepted: "Accepted", declined: "Not this time", withdrawn: "Withdrawn" };
const OPEN = ["new", "reviewing", "interview"];
const REGION = { us: "United States", canada: "Canada", latam: "Latin America", europe: "Europe", uk: "UK and Ireland", mea: "Middle East and Africa", asia: "Asia", oceania: "Australia and NZ", other: "Elsewhere" };
const TRACK = { seminars: "Seminars", mentorship: "Mentorship", programming: "Programming" };
const COURSE = { "tgc-l1": "TGC Level 1 seminar", "tgc-l1-online": "TGC Level 1 online", "tgc-l2": "TGC Level 2", "tcc-l1": "TCC Level 1 seminar", "tcc-l1-online": "TCC Level 1 online", "tcc-l2": "TCC Level 2" };

let all = [];
let pathways = {};
let course = "all";
const inCourse = (a) => course === "all" || a.brand === course;
let tab = "open";
let fresh = new Set();
const openRows = new Set();

async function call(body, retried = false) {
  const { data: { session } } = await db.auth.getSession();
  const r = await fetch("/.netlify/functions/pathway-admin", {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + (session ? session.access_token : "") },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 && !retried) {
    const { error } = await db.auth.refreshSession();
    if (!error) return call(body, true);
    gate('Your login has expired. <a href="/portal/">Sign in to the portal</a>, then come back to this page.');
    throw new Error("Please sign in again.");
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "That did not work.");
  if (d.applications) all = d.applications;
  if (d.pathways) pathways = d.pathways;
  return d;
}

async function start() {
  show("gate");
  const { data: { session } } = await db.auth.getSession();
  if (!session) return gate('You are not signed in. <a href="/portal/">Sign in to the portal</a>, then come back to this page.');
  const { data: staff } = await db.from("staff").select("role, active").eq("id", session.user.id).maybeSingle();
  if (!staff || !staff.active || staff.role !== "admin") return gate('The Staff Pathway is admin only. <a href="/portal/">Back to the portal</a>.');
  show("main");
  try {
    await call();
    fresh = new Set(all.filter((a) => !a.seen_at).map((a) => a.id));
    render();
    if (fresh.size) call({ action: "seen" }).catch(() => {});
  } catch (e) { say(e.message, "err"); }
}

function visible() {
  const q = $("q").value.trim().toLowerCase();
  let list = all.filter(inCourse);
  if (tab === "open") list = list.filter((a) => OPEN.includes(a.status));
  if (tab === "accepted") list = list.filter((a) => a.status === "accepted");
  if (tab === "declined") list = list.filter((a) => a.status === "declined" || a.status === "withdrawn");
  if (q) list = list.filter((a) => [a.full_name, a.email, a.country, a.city, a.gym].join(" ").toLowerCase().includes(q));
  return list;
}

// Typing in an open application survives a re-render (another button,
// the search box), until it is saved or sent.
const typed = {};
function keepTyped() {
  document.querySelectorAll("#list textarea[id], #list input[id]").forEach((el) => { typed[el.id] = el.value; });
}
function putTyped() {
  for (const [id, v] of Object.entries(typed)) { const el = $(id); if (el) el.value = v; }
}

function render() {
  keepTyped();
  const mine = all.filter(inCourse);
  $("n-open").textContent = " " + mine.filter((a) => OPEN.includes(a.status)).length;
  $("n-accepted").textContent = " " + mine.filter((a) => a.status === "accepted").length;
  $("n-declined").textContent = " " + mine.filter((a) => a.status === "declined" || a.status === "withdrawn").length;
  $("n-all").textContent = " " + mine.length;
  renderTracker();
  const list = visible();
  $("list").innerHTML = list.length ? list.map(row).join("") :
    `<div class="empty">${tab === "open" ? "Nothing waiting to be reviewed." : "Nobody here yet."}</div>`;
  putTyped();
}

// For TEC: where we still need people, against the targets for each
// region. Accepted coaches count towards a target; ones still being
// reviewed are shown alongside.
function renderTracker() {
  const t = pathways.tec && pathways.tec.targets;
  const box = $("tracker");
  if (!t || course === "tgc") { box.classList.add("hidden"); return; }
  const tec = all.filter((a) => a.brand === "tec");
  box.innerHTML = `<h2>TEC founding staff: where we need people</h2><div class="regions">${t.map((r) => {
    const here = tec.filter((a) => r.regions.includes(a.region));
    const yes = here.filter((a) => a.status === "accepted").length;
    const open = here.filter((a) => OPEN.includes(a.status)).length;
    const min = parseInt(r.want, 10) || 1;
    return `<div class="r${yes >= min ? " met" : ""}"><b>${esc(r.label)}</b><span class="n">${yes} <small>of ${esc(r.want)}</small></span><div class="meta">${open} in review</div></div>`;
  }).join("")}</div>`;
  box.classList.remove("hidden");
}

function certLine(a) {
  // Only TGC asks for a completed course; TEC applicants show any
  // BirdBox certificates they hold, and nothing if they have none.
  if (a.brand !== "tgc") return a.certificates.length ? '<span class="pill cert">✓ BirdBox certificate</span>' : "";
  const tgc = a.certificates.filter((c) => c.brand === a.brand && c.kind !== "workshop");
  return tgc.length ? `<span class="pill cert">✓ ${a.brand.toUpperCase()} certificate</span>` : `<span class="pill nocert">No ${a.brand.toUpperCase()} certificate found</span>`;
}

function row(a) {
  const isOpen = openRows.has(a.id);
  const where = [a.city, a.country].filter(Boolean).join(", ");
  const words = a.why.trim().split(/\s+/).length;
  const head = `<div class="head" data-toggle="${a.id}">
    <div>
      <div class="name">${esc(a.full_name)} <span class="pill st-${a.status}">${STATUS[a.status]}</span>${fresh.has(a.id) ? '<span class="pill new">New</span>' : ""}${certLine(a)}</div>
      <div class="meta">${esc(where)} · ${REGION[a.region]} · ${esc(a.languages.join(", "))}</div>
      <div class="meta">${a.brand.toUpperCase()} · ${(a.tracks || []).map((t) => TRACK[t]).join(", ")} · applied ${day(a.created_at)}${a.earlier.length ? ` · applied before (${a.earlier.length})` : ""}</div>
    </div>
    <span class="chev">${isOpen ? "Close ▲" : "Open ▼"}</span>
  </div>`;
  if (!isOpen) return `<div class="app${a.status === "new" ? " attn" : ""}">${head}</div>`;

  const certs = a.certificates.length
    ? a.certificates.map((c) => `${esc(c.course_title || (c.brand.toUpperCase() + " " + (c.level || "")))} <span class="meta">(${esc([c.awarded_on && String(c.awarded_on).slice(0, 7), c.place].filter(Boolean).join(", "))})</span>`).join("<br>")
    : '<span class="meta">None under this email</span>';
  const r = a.reference || {};
  const moveList = (group) => (a.movement_videos || []).filter((m) => (m.group || "Strict") === group)
    .map((m) => `<li>${play(m.view || m.url, "▶ " + m.movement, `${group}: ${m.movement}`)}${m.uploaded ? ' <span class="meta">uploaded</span>' : ""}</li>`).join("");
  const moves = ["Strict", "Dynamic"].map((g) => { const l = moveList(g); return l ? `<li class="grp">${g}</li>${l}` : ""; }).join("");
  const earlier = a.earlier.map((o) => `<div class="told"><b>${day(o.created_at)}: ${STATUS[o.status]}</b>${o.decision_message ? "\n" + esc(o.decision_message) : ""}</div>`).join("");

  const decided = a.status === "accepted" || a.status === "declined";
  const side = decided
    ? `<h3>What we told them (${day(a.decided_at)})</h3><div class="told">${esc(a.decision_message)}</div>${a.decision_video ? `<div>${play(a.decision_video, "▶ Feedback video", "Our feedback video")}</div>` : ""}`
    : `<h3>Stage</h3>
       <div class="row">
         ${["reviewing", "interview"].map((s) => `<button class="btn small${a.status === s ? " primary" : ""}" data-act="status" data-status="${s}" data-id="${a.id}">${STATUS[s]}</button>`).join("")}
         <button class="btn small bad" data-act="status" data-status="withdrawn" data-id="${a.id}">Withdrawn</button>
       </div>
       <h3>Decision</h3>
       <textarea class="decision" id="dm-${a.id}" placeholder="Your message to ${esc(a.full_name.split(" ")[0])}. If declining, include what to work on: which courses, outside study, and how many more coaching hours.">${esc(a.decision_message || "")}</textarea>
       <input id="dv-${a.id}" type="url" placeholder="Feedback video link (optional)">
       <div class="row">
         <button class="btn small good" data-act="decide" data-outcome="accepted" data-id="${a.id}">Accept and email</button>
         <button class="btn small bad" data-act="decide" data-outcome="declined" data-id="${a.id}">Decline and email</button>
       </div>`;

  return `<div class="app">${head}
    <div class="body">
      <div>
        <h3>Contact</h3>
        <dl>
          <dt>Email</dt><dd><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></dd>
          ${a.phone ? `<dt>Phone</dt><dd>${esc(a.phone)}</dd>` : ""}
          ${a.gym ? `<dt>Coaches at</dt><dd>${esc(a.gym)}</dd>` : ""}
          <dt>Years coaching</dt><dd>${a.years_coaching ?? "–"}</dd>
        </dl>
        <h3>Courses</h3>
        <dl>
          <dt>They ticked</dt><dd>${(a.courses || []).map((c) => COURSE[c] || c).join(", ") || "–"}</dd>
          ${a.course_when ? `<dt>Most recent</dt><dd>${esc(a.course_when)}</dd>` : ""}
          <dt>Our records</dt><dd>${certs}</dd>
        </dl>
        <h3>Documents</h3>
        <dl>
          <dt>CV</dt><dd>${play(a.cv_url, "Open CV", `CV: ${a.full_name}`)}</dd>
          <dt>Coaching philosophy</dt><dd>${play(a.philosophy_url, "Open coaching philosophy", `Coaching philosophy: ${a.full_name}`)}</dd>
        </dl>
        ${a.other_quals ? `<h3>Other qualifications</h3><div class="written" style="max-height:10rem">${esc(a.other_quals)}</div>` : ""}
        <h3>Coaching video</h3>
        <div>${play(a.coaching_video, "▶ Watch coaching video", "Coaching video")}</div>
        <h3>Movement mastery</h3>
        <ul class="moves">${moves}</ul>
        <h3>Written piece (${words} words)</h3>
        <div class="written">${esc(a.why)}</div>
        <h3>Reference</h3>
        <dl>
          <dt>Name</dt><dd>${esc(r.name)}</dd>
          <dt>Email</dt><dd><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></dd>
          ${r.role ? `<dt>Role</dt><dd>${esc(r.role)}</dd>` : ""}
          ${r.relation ? `<dt>Knows them</dt><dd>${esc(r.relation)}</dd>` : ""}
        </dl>
      </div>
      <div class="side">
        ${side}
        <h3>Private notes</h3>
        <textarea id="nt-${a.id}" placeholder="Only you and Michaela see these">${esc(a.notes || "")}</textarea>
        <div class="row"><button class="btn small" data-act="notes" data-id="${a.id}">Save notes</button>
          <button class="btn small bad" data-act="delete" data-id="${a.id}">Delete</button></div>
        ${earlier ? `<h3>Earlier applications</h3>${earlier}` : ""}
      </div>
    </div>
  </div>`;
}

$("list").addEventListener("click", async (e) => {
  const pl = e.target.closest("a[data-play]");
  if (pl && !(e.metaKey || e.ctrlKey || e.shiftKey)) {
    if (openPlayer(pl)) e.preventDefault();
    return;
  }
  const t = e.target.closest("[data-toggle]");
  if (t && !e.target.closest("a")) {
    const id = t.dataset.toggle;
    openRows.has(id) ? openRows.delete(id) : openRows.add(id);
    return render();
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = all.find((x) => x.id === b.dataset.id);
  const body = { action: b.dataset.act, id: a.id };
  if (body.action === "status") body.status = b.dataset.status;
  if (body.action === "notes") body.notes = $("nt-" + a.id).value;
  if (body.action === "decide") {
    body.outcome = b.dataset.outcome;
    body.message = $("dm-" + a.id).value;
    body.video = $("dv-" + a.id).value;
    const verb = body.outcome === "accepted" ? "Accept" : "Decline";
    if (!confirm(`${verb} ${a.full_name} and email them this message now?`)) return;
  }
  if (body.action === "delete" && !confirm(`Delete ${a.full_name}'s application for good?`)) return;
  b.disabled = true;
  try {
    await call(body);
    if (body.action === "notes") delete typed["nt-" + a.id];
    if (body.action === "decide") { delete typed["dm-" + a.id]; delete typed["dv-" + a.id]; }
    say(body.action === "decide" ? `Emailed ${a.full_name}.` : "Saved.", "ok");
    render();
  } catch (err) { say(err.message, "err"); b.disabled = false; }
});

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
$("q").addEventListener("input", render);
$("course").addEventListener("change", (e) => { course = e.target.value; render(); });

/* ---------------- the player ----------------
   Videos and documents open on top of the review page. Uploads play
   straight from our storage; YouTube, Vimeo, Google Drive and Dropbox
   links play in their own player here. Anything else opens in a new
   tab as before. Previous / Next (or the arrow keys) step through the
   videos of the application that is open. */
let plItems = [], plAt = 0;

function embedFor(u) {
  let url;
  try { url = new URL(u); } catch (e) { return null; }
  const h = url.hostname.replace(/^(www|m)\./, "");
  const ext = (url.pathname.split(".").pop() || "").toLowerCase();
  const isVideo = ["mp4", "mov", "m4v", "webm", "3gp"].includes(ext);
  if (h === "dropbox.com") {
    url.searchParams.delete("dl"); url.searchParams.set("raw", "1");
    return { kind: ext === "pdf" ? "doc" : "video", src: url.toString() };
  }
  if (isVideo) return { kind: "video", src: u };
  if (ext === "pdf") return { kind: "doc", src: u };
  if (h === "youtu.be" || h.endsWith("youtube.com")) {
    let id = h === "youtu.be" ? url.pathname.slice(1) : url.searchParams.get("v");
    if (!id) { const m = url.pathname.match(/\/(shorts|live|embed)\/([^/?]+)/); if (m) id = m[2]; }
    if (!id) return null;
    const t = String(url.searchParams.get("t") || url.searchParams.get("start") || "");
    const tm = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
    const start = tm ? (+(tm[1] || 0)) * 3600 + (+(tm[2] || 0)) * 60 + (+(tm[3] || 0)) : 0;
    return { kind: "frame", src: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0${start ? "&start=" + start : ""}` };
  }
  if (h === "player.vimeo.com") return { kind: "frame", src: u };
  if (h === "vimeo.com") {
    const m = url.pathname.match(/^\/(\d+)(?:\/([0-9a-f]+))?/);
    if (!m) return null;
    return { kind: "frame", src: `https://player.vimeo.com/video/${m[1]}?autoplay=1${m[2] ? "&h=" + m[2] : ""}` };
  }
  if (h === "drive.google.com") {
    const m = url.pathname.match(/\/file\/d\/([^/]+)/);
    const id = m ? m[1] : url.searchParams.get("id");
    if (!id) return null;
    return { kind: "frame", src: `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview` };
  }
  return null;
}

function openPlayer(a) {
  if (!embedFor(a.href)) return false;
  const box = a.closest(".app") || document;
  // Step through videos only: documents open on their own.
  const doc = embedFor(a.href).kind === "doc";
  plItems = doc ? [a] : [...box.querySelectorAll("a[data-play]")].filter((x) => { const e = embedFor(x.href); return e && e.kind !== "doc"; });
  plAt = Math.max(0, plItems.indexOf(a));
  showItem();
  $("player").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  $("pl-close").focus();
  return true;
}

function showItem() {
  const a = plItems[plAt], e = embedFor(a.href);
  $("pl-title").textContent = a.dataset.title || a.textContent;
  $("pl-out").href = a.href;
  const stage = $("pl-stage");
  if (e.kind === "video") {
    stage.innerHTML = `<video controls autoplay playsinline preload="metadata"></video>`;
    const v = stage.querySelector("video");
    v.src = e.src;
    v.onerror = () => {
      stage.innerHTML = `<div class="pl-msg">This video will not play inside the portal (some phone formats only play in Safari).<br><a href="${esc(a.href)}" target="_blank" rel="noopener">Open it in a new tab ↗</a></div>`;
    };
  } else {
    stage.innerHTML = `<iframe class="${e.kind === "doc" ? "doc" : ""}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    stage.querySelector("iframe").src = e.src;
  }
  const many = plItems.length > 1;
  $("pl-prev").classList.toggle("hidden", !many);
  $("pl-next").classList.toggle("hidden", !many);
  $("pl-prev").disabled = plAt === 0;
  $("pl-next").disabled = plAt === plItems.length - 1;
  $("pl-count").textContent = many ? `${plAt + 1} of ${plItems.length}` : "";
}

function closePlayer() {
  $("player").classList.add("hidden");
  $("pl-stage").innerHTML = "";   // stops the video
  document.body.style.overflow = "";
}

$("pl-close").addEventListener("click", closePlayer);
$("player").addEventListener("click", (e) => { if (e.target.id === "player") closePlayer(); });
$("pl-prev").addEventListener("click", () => { if (plAt > 0) { plAt--; showItem(); } });
$("pl-next").addEventListener("click", () => { if (plAt < plItems.length - 1) { plAt++; showItem(); } });
document.addEventListener("keydown", (e) => {
  if ($("player").classList.contains("hidden")) return;
  if (e.key === "Escape") closePlayer();
  if (e.key === "ArrowLeft" && plAt > 0) { plAt--; showItem(); }
  if (e.key === "ArrowRight" && plAt < plItems.length - 1) { plAt++; showItem(); }
});

start();
</script>
</body>
