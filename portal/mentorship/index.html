<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mentorship — BirdBox Coaching</title>
<style>
  :root { --ink:#16181b; --paper:#f4f3f0; --card:#fff; --shell:#0d0e10; --rule:#e0ddd7; --muted:#6c7178;
          --accent:#2f7fd0; --good:#1f8a54; --warn:#b4610f; --bad:#b3261e; }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .bar{background:var(--shell);color:#fff;padding:0.7rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .bar .left{display:flex;align-items:center;gap:0.75rem}
  .mark{width:34px;height:34px;border-radius:4px;background:#fff;display:grid;place-items:center}
  .mark img{width:26px;height:26px;object-fit:contain}
  .brandname{font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:#9aa1a9}
  .bar a{color:#cfd4d9;font-size:0.85rem;text-decoration:none}
  .wrap{max-width:60rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
  h1{font-size:1.4rem;margin:0 0 0.2rem;font-weight:600}
  .sub{color:var(--muted);font-size:0.9rem;margin:0 0 1.5rem}
  h2{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin:0 0 1rem;font-weight:600}
  label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:0.3rem}
  .hint{font-weight:400;color:var(--muted);font-size:0.78rem}
  input,select,textarea{width:100%;font:inherit;padding:0.55rem 0.65rem;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
  textarea{min-height:80px}
  .field{margin-bottom:1rem}
  .grid3{display:grid;gap:0 1rem;grid-template-columns:1fr}
  @media(min-width:40rem){.grid3{grid-template-columns:1fr 1fr 1fr}}
  .panel{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:1.25rem;margin-bottom:1.25rem}
  .btn{font:inherit;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:4px;padding:0.6rem 1.1rem;cursor:pointer}
  .btn[disabled]{opacity:0.5}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule);font-weight:500}
  .btn.small{font-size:0.8rem;padding:0.35rem 0.7rem}
  .msg{font-size:0.85rem;margin-top:0.6rem;min-height:1.2em}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
  .hidden{display:none!important}
  table{width:100%;border-collapse:collapse;font-size:0.85rem}
  th,td{text-align:left;padding:0.5rem 0.45rem;border-bottom:1px solid var(--rule);vertical-align:top}
  th{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  tr.click{cursor:pointer} tr.click:hover td{background:#faf9f7}
  .pill{display:inline-block;font-size:0.7rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:0.1rem 0.45rem;border-radius:3px}
  .pill.tcc{background:#eef5fd;color:#2f7fd0} .pill.tgc{background:#fcf0ef;color:#b3261e}
  .pill.prem{background:#f3ecfb;color:#6b3fa0} .pill.ess{background:#eceae6;color:#555}
  .pill.due{background:#fbecd9;color:var(--warn)}
  .rep{border:1px solid var(--rule);border-radius:4px;padding:0.9rem;margin:0 0 0.8rem}
  .rep h3{margin:0 0 0.5rem;font-size:0.95rem}
  .qa{margin:0 0 0.6rem;font-size:0.9rem}
  .qa b{display:block;font-size:0.78rem;color:var(--muted);font-weight:600}
  .qa div{white-space:pre-wrap}
</style>
</head>
<body>
<div class="bar">
  <div class="left"><span class="mark"><img src="/brand/birdBox.png" alt=""></span><span class="brandname">BirdBox Coaching</span></div>
  <a href="/portal/">&larr; Portal</a>
</div>

<div class="wrap">
  <h1>Mentorship</h1>
  <p class="sub">Mentees, their mentors and their weekly reflections. Learners see theirs at birdboxcoaching.com/learn/mentorship</p>
  <div id="gate">Loading…</div>

  <div id="app" class="hidden">
    <div class="panel" id="add-panel">
      <h2>Add a mentee</h2>
      <div class="grid3">
        <div class="field"><label for="a-email">Email <span class="hint">(the one they log in with)</span></label><input id="a-email" type="email"></div>
        <div class="field"><label for="a-first">First name</label><input id="a-first"></div>
        <div class="field"><label for="a-last">Last name</label><input id="a-last"></div>
      </div>
      <div class="grid3">
        <div class="field"><label for="a-brand">Brand</label><select id="a-brand"><option value="tcc">TCC</option><option value="tgc">TGC</option></select></div>
        <div class="field"><label for="a-track">Track</label><select id="a-track"><option value="essential">Essential</option><option value="premium">Premium</option></select></div>
        <div class="field"><label for="a-mentor">Mentor</label><select id="a-mentor"></select></div>
      </div>
      <div class="grid3">
        <div class="field"><label for="a-start">Start date</label><input id="a-start" type="date"></div>
        <div class="field"><label for="a-weeks">Weeks</label><input id="a-weeks" type="number" value="12" min="1"></div>
        <div class="field"><label for="a-cohort">Cohort <span class="hint">(Premium groups, optional)</span></label><input id="a-cohort" placeholder="e.g. Jan 2027"></div>
      </div>
      <button id="a-go" class="btn" type="button">Add mentee</button>
      <div id="a-msg" class="msg"></div>
    </div>

    <div class="panel">
      <h2 id="list-title">Mentees</h2>
      <div style="overflow-x:auto"><table id="list"></table></div>
    </div>

    <div class="panel hidden" id="detail">
      <h2 id="d-title"></h2>
      <div class="grid3">
        <div class="field"><label for="d-mentor">Mentor</label><select id="d-mentor"></select></div>
        <div class="field"><label for="d-status">Status</label><select id="d-status"><option value="active">Active</option><option value="paused">Paused</option><option value="finished">Finished</option></select></div>
        <div class="field"><label for="d-track">Track</label><select id="d-track"><option value="essential">Essential</option><option value="premium">Premium</option></select></div>
      </div>
      <button id="d-save" class="btn ghost small" type="button">Save changes</button>
      <span id="d-msg" class="msg"></span>
      <div id="d-weeks" style="margin-top:1.2rem"></div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const db = createClient("https://yvdmazpxtpuvidlcifnq.supabase.co", "sb_publishable_GOrQSPEuHhbKLQMgqsATvg_rKpro7uZ");
const $ = (id) => document.getElementById(id);
import { WEEKS, OLD_LABELS } from "/learn/mentorship/weeks.js";
const KIND = { start: "Start of the week", end: "End of the week" };
// Question list for a saved reflection: this week's form, plus any older keys it still holds.
function questionsFor(r) {
  const def = WEEKS[r.week] && WEEKS[r.week][r.kind];
  const out = [];
  if (def) for (const q of def.qs) if (Array.isArray(q)) out.push([q[0], q[1], q[2] === "scale" ? " (1–10)" : ""]);
  for (const k in (r.answers || {})) if (!out.some((q) => q[0] === k)) out.push([k, OLD_LABELS[k] || k, ""]);
  return { title: KIND[r.kind] + (def ? " — " + def.title : ""), qs: out };
}
let me = null, isAdmin = false, staff = [], list = [], refl = [], current = null;

boot();
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $("gate").innerHTML = 'You are not signed in. <a href="/portal/">Sign in to the portal</a> first, then come back.'; return; }
  const { data: s } = await db.from("staff").select("id, role, active, full_name").eq("id", session.user.id).maybeSingle();
  if (!s || !s.active) { $("gate").textContent = "Only BirdBox staff can open this page."; return; }
  me = s; isAdmin = s.role === "admin";
  const { data: st } = await db.from("staff").select("id, full_name").eq("active", true).order("full_name");
  staff = st || [];
  for (const sel of ["a-mentor", "d-mentor"]) $(sel).innerHTML = '<option value="">— not assigned —</option>' + staff.map((x) => `<option value="${x.id}"></option>`).join("");
  for (const sel of ["a-mentor", "d-mentor"]) [...$(sel).options].slice(1).forEach((o, i) => { o.textContent = staff[i].full_name; });
  $("a-start").value = new Date().toISOString().slice(0, 10);
  if (!isAdmin) { $("add-panel").classList.add("hidden"); $("list-title").textContent = "My mentees"; }
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
  await load();
}

async function load() {
  const [{ data: ms }, { data: rs }] = await Promise.all([
    db.from("learn_mentorships").select("*").order("created_at", { ascending: false }),
    db.from("learn_mentor_reflections").select("*"),
  ]);
  list = (ms || []).filter((x) => isAdmin || x.mentor_id === me.id);
  refl = rs || [];
  renderList();
  if (current) openDetail(list.find((x) => x.id === current.id));
}

const weekOf = (m) => Math.max(1, Math.min(m.weeks, Math.floor((Date.now() - new Date(m.start_date + "T00:00:00")) / 86400000 / 7) + 1));
const unread = (m) => refl.filter((r) => r.mentorship_id === m.id && r.submitted_at && !r.mentor_comment).length;

function renderList() {
  const t = $("list");
  if (!list.length) { t.innerHTML = '<tr><td class="hint">No mentees yet.</td></tr>'; return; }
  t.innerHTML = "<thead><tr><th>Mentee</th><th>Course</th><th>Mentor</th><th>Week</th><th>Reflections to reply to</th><th>Status</th></tr></thead>";
  const tb = document.createElement("tbody");
  for (const m of list) {
    const tr = document.createElement("tr"); tr.className = "click";
    const td = (html) => { const x = document.createElement("td"); x.innerHTML = html; tr.appendChild(x); return x; };
    const a = td("<b></b><br><span class='hint'></span>"); a.querySelector("b").textContent = [m.first_name, m.last_name].filter(Boolean).join(" ") || "—"; a.querySelector("span").textContent = m.email;
    td(`<span class="pill ${m.brand}">${m.brand.toUpperCase()}</span> <span class="pill ${m.track === "premium" ? "prem" : "ess"}">${m.track}</span>`);
    td("").textContent = m.mentor_name || "—";
    td("").textContent = weekOf(m) + " / " + m.weeks + (m.cohort ? " · " + m.cohort : "");
    const u = unread(m); td(u ? `<span class="pill due">${u} waiting</span>` : "—");
    td("").textContent = m.status;
    tr.onclick = () => openDetail(m);
    tb.appendChild(tr);
  }
  t.appendChild(tb);
}

$("a-go").addEventListener("click", async () => {
  const msg = $("a-msg"); msg.className = "msg";
  const email = $("a-email").value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.className = "msg err"; msg.textContent = "Enter their email."; return; }
  const mentor = staff.find((x) => x.id === $("a-mentor").value);
  $("a-go").disabled = true;
  const { error } = await db.from("learn_mentorships").insert({
    email, first_name: $("a-first").value.trim() || null, last_name: $("a-last").value.trim() || null,
    brand: $("a-brand").value, track: $("a-track").value, mentor_id: mentor ? mentor.id : null, mentor_name: mentor ? mentor.full_name : null,
    start_date: $("a-start").value || new Date().toISOString().slice(0, 10), weeks: parseInt($("a-weeks").value, 10) || 12, cohort: $("a-cohort").value.trim() || null,
  });
  $("a-go").disabled = false;
  if (error) { msg.className = "msg err"; msg.textContent = error.message; return; }
  msg.className = "msg ok"; msg.textContent = "Added. They see it at birdboxcoaching.com/learn/mentorship once logged in with " + email + ".";
  for (const id of ["a-email", "a-first", "a-last", "a-cohort"]) $(id).value = "";
  load();
});

function openDetail(m) {
  if (!m) return;
  current = m;
  const d = $("detail"); d.classList.remove("hidden");
  $("d-title").textContent = ([m.first_name, m.last_name].filter(Boolean).join(" ") || m.email) + " · " + m.brand.toUpperCase() + " " + m.track;
  $("d-mentor").value = m.mentor_id || ""; $("d-status").value = m.status; $("d-track").value = m.track;
  for (const id of ["d-mentor", "d-status", "d-track", "d-save"]) $(id).disabled = !isAdmin;
  const box = $("d-weeks"); box.innerHTML = "";
  const rs = refl.filter((r) => r.mentorship_id === m.id).sort((a, b) => b.week - a.week || (a.kind === "start" ? -1 : 1));
  if (!rs.length) box.innerHTML = '<p class="hint">No reflections yet.</p>';
  for (const r of rs) {
    const { title, qs } = questionsFor(r);
    const el = document.createElement("div"); el.className = "rep";
    const h = document.createElement("h3"); h.textContent = "Week " + r.week + (WEEKS[r.week] ? " (" + WEEKS[r.week].title + ")" : "") + " · " + title + (r.submitted_at ? " · sent " + new Date(r.submitted_at).toLocaleDateString("en-GB") : " · draft");
    el.appendChild(h);
    for (const [k, label, suffix] of qs) {
      const v = r.answers && r.answers[k]; if (v == null || v === "") continue;
      const qa = document.createElement("div"); qa.className = "qa";
      const b = document.createElement("b"); b.textContent = label + suffix;
      const t = document.createElement("div"); t.textContent = String(v);
      qa.append(b, t); el.appendChild(qa);
    }
    const ta = document.createElement("textarea"); ta.placeholder = "Your reply to the mentee"; ta.value = r.mentor_comment || "";
    const btn = document.createElement("button"); btn.className = "btn small"; btn.type = "button"; btn.textContent = r.mentor_comment ? "Update reply" : "Send reply";
    const msg = document.createElement("span"); msg.className = "msg"; msg.style.marginLeft = "0.6rem";
    btn.onclick = async () => {
      btn.disabled = true;
      const { error } = await db.from("learn_mentor_reflections").update({ mentor_comment: ta.value.trim() || null, mentor_comment_at: new Date().toISOString() }).eq("id", r.id);
      btn.disabled = false;
      if (error) { msg.className = "msg err"; msg.textContent = error.message; return; }
      msg.className = "msg ok"; msg.textContent = "Sent ✓"; r.mentor_comment = ta.value.trim(); renderList();
    };
    const lab = document.createElement("label"); lab.textContent = "Reply"; lab.style.marginTop = "0.6rem";
    el.append(lab, ta, btn, msg);
    box.appendChild(el);
  }
  d.scrollIntoView({ behavior: "smooth", block: "start" });
}

$("d-save").addEventListener("click", async () => {
  if (!current) return;
  const mentor = staff.find((x) => x.id === $("d-mentor").value);
  const { error } = await db.from("learn_mentorships").update({
    mentor_id: mentor ? mentor.id : null, mentor_name: mentor ? mentor.full_name : null, status: $("d-status").value, track: $("d-track").value,
  }).eq("id", current.id);
  $("d-msg").className = error ? "msg err" : "msg ok"; $("d-msg").textContent = error ? error.message : "Saved ✓";
  if (!error) load();
});
</script>
</body>
</html>
