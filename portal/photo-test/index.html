<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo test</title>
<style>
  body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    margin:0;padding:1.5rem;background:#f4f3f0;color:#16181b;line-height:1.55}
  h1{font-size:1.2rem;margin:0 0 1rem}
  .step{background:#fff;border:1px solid #e0ddd7;border-radius:6px;
    padding:0.8rem 1rem;margin-bottom:0.6rem;font-size:0.9rem}
  .ok{color:#1f8a54;font-weight:650}
  .bad{color:#b3261e;font-weight:650}
  pre{white-space:pre-wrap;word-break:break-all;font-size:0.8rem;
    background:#faf9f7;padding:0.6rem;border-radius:4px;margin:0.4rem 0 0}
  label.pickrow{display:block;background:#fff;border:1px solid #e0ddd7;border-radius:6px;
    padding:0.9rem 1rem;margin-top:0.8rem;font-weight:650;cursor:pointer}
  label.pickrow span{display:block;font-weight:400;font-size:0.82rem;color:#6c7178}
  input[type=file]{display:none}
  img{max-width:180px;border-radius:6px;margin-top:0.8rem;display:block}
</style>
</head>
<body>

<h1>Participant photo — diagnostic</h1>
<p style="font-size:0.9rem;color:#6c7178;margin:0 0 1rem">
  This now runs every step the portal runs, including saving the path
  against the registration.
</p>

<div id="out"></div>

<label class="pickrow">
  Take a photo with the camera
  <input type="file" accept="image/*" capture="user" id="pick" disabled>
</label>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const db = createClient(
  "https://yvdmazpxtpuvidlcifnq.supabase.co",
  "sb_publishable_GOrQSPEuHhbKLQMgqsATvg_rKpro7uZ"
);

const out = document.getElementById("out");
const pick = document.getElementById("pick");
let target = null;
let me = null;

function say(label, ok, detail) {
  const el = document.createElement("div");
  el.className = "step";
  el.innerHTML = `<span class="${ok ? "ok" : "bad"}">${ok ? "OK" : "FAILED"}</span> — ${label}`;
  if (detail) {
    const pre = document.createElement("pre");
    pre.textContent = typeof detail === "string" ? detail : JSON.stringify(detail, null, 2);
    el.append(pre);
  }
  out.append(el);
  return ok;
}

(async function setup() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return say("Signed in", false, "No session — sign into /portal/ first.");

  const { data: staff } = await db.from("staff")
    .select("id, full_name, role").eq("id", session.user.id).maybeSingle();
  me = staff;
  say("Signed in", true, `${staff?.full_name} — role: ${staff?.role}`);

  const { data: regs, error } = await db.from("registrations")
    .select("id, first_name, last_name, course_id, photo_path").limit(1);

  if (error) return say("Read registrations", false, error);
  if (!regs?.length) return say("Read registrations", false, "No registrations visible.");

  target = regs[0];
  say("Participant to test with", true,
    `${target.first_name} ${target.last_name}\ncourse: ${target.course_id}\nregistration: ${target.id}`);

  // Can this account see the course through the same rule the policy uses?
  const { data: seen, error: seeErr } = await db.rpc("can_see_course", {
    course_id: target.course_id,
  });
  if (seeErr) say("can_see_course() check", false, seeErr);
  else say("can_see_course() returns", seen === true, String(seen));

  pick.disabled = false;
})();

pick.addEventListener("change", async () => {
  const file = pick.files[0];
  if (!file || !target) return;
  out.innerHTML = "";

  say("Photo taken", true, `${file.type} · ${Math.round(file.size / 1024)} KB`);

  let blob;
  try {
    blob = await shrink(file);
    say("Shrunk", true, `${Math.round(blob.size / 1024)} KB`);
  } catch (err) {
    return say("Shrunk", false, err.message || String(err));
  }

  const img = document.createElement("img");
  img.src = URL.createObjectURL(blob);
  out.append(img);

  const path = `${target.course_id}/${target.id}.jpg`;

  const { error: upErr } = await db.storage
    .from("participant-photos")
    .upload(path, blob, { contentType: "image/jpeg", upsert: true });
  if (upErr) return say("Uploaded to storage", false, upErr);
  say("Uploaded to storage", true, path);

  // ---- the step the portal does that the last test did not ----
  const { data: updated, error: dbErr } = await db.from("registrations")
    .update({ photo_path: path, photo_taken_at: new Date().toISOString() })
    .eq("id", target.id)
    .select();

  if (dbErr) {
    return say("Saved path on the registration", false, {
      message: dbErr.message,
      code: dbErr.code,
      details: dbErr.details,
      hint: dbErr.hint,
    });
  }

  if (!updated || !updated.length) {
    return say("Saved path on the registration", false,
      "No error, but no row came back. The update policy is silently blocking it.");
  }
  say("Saved path on the registration", true, `photo_path = ${updated[0].photo_path}`);

  const { data: signed, error: signErr } = await db.storage
    .from("participant-photos").createSignedUrl(path, 600);
  if (signErr) return say("Signed link", false, signErr);
  say("Signed link", true, "Everything worked.");

  const back = document.createElement("img");
  back.src = signed.signedUrl;
  out.append(back);
  pick.value = "";
});

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(
        (b) => b ? resolve(b) : reject(new Error("toBlob returned nothing")),
        "image/jpeg", 0.82
      );
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not decode")); };
    img.src = url;
  });
}
</script>

</body>
</html>
