<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo test</title>
<style>
  body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    margin:0;padding:1.5rem;background:#f4f3f0;color:#16181b;line-height:1.55}
  h1{font-size:1.2rem;margin:0 0 1rem}
  .step{background:#fff;border:1px solid #e0ddd7;border-radius:6px;
    padding:0.8rem 1rem;margin-bottom:0.6rem;font-size:0.9rem}
  .ok{color:#1f8a54;font-weight:650}
  .bad{color:#b3261e;font-weight:650}
  pre{white-space:pre-wrap;word-break:break-all;font-size:0.8rem;
    background:#faf9f7;padding:0.6rem;border-radius:4px;margin:0.4rem 0 0}
  label.pickrow{display:block;background:#fff;border:1px solid #e0ddd7;border-radius:6px;
    padding:0.9rem 1rem;margin-top:0.8rem;font-weight:650;cursor:pointer}
  label.pickrow span{display:block;font-weight:400;font-size:0.82rem;color:#6c7178}
  input[type=file]{display:none}
  img{max-width:200px;border-radius:6px;margin-top:0.8rem;display:block}
</style>
</head>
<body>

<h1>Participant photo — diagnostic</h1>
<p style="font-size:0.9rem;color:#6c7178;margin:0 0 1rem">
  Try the camera one. That is what the portal uses.
</p>

<div id="out"></div>

<label class="pickrow" id="row-cam">
  Take a photo with the camera
  <span>Same as the portal — this is the one that fails</span>
  <input type="file" accept="image/*" capture="user" id="pick-cam" disabled>
</label>

<label class="pickrow" id="row-lib">
  Choose from the photo library
  <span>This is what worked last time</span>
  <input type="file" accept="image/*" id="pick-lib" disabled>
</label>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const db = createClient(
  "https://yvdmazpxtpuvidlcifnq.supabase.co",
  "sb_publishable_GOrQSPEuHhbKLQMgqsATvg_rKpro7uZ"
);

const out = document.getElementById("out");
let target = null;

function say(label, ok, detail) {
  const el = document.createElement("div");
  el.className = "step";
  el.innerHTML = `<span class="${ok ? "ok" : "bad"}">${ok ? "OK" : "FAILED"}</span> — ${label}`;
  if (detail) {
    const pre = document.createElement("pre");
    pre.textContent = typeof detail === "string" ? detail : JSON.stringify(detail, null, 2);
    el.append(pre);
  }
  out.append(el);
  return ok;
}

(async function setup() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return say("Signed in", false, "No session — sign into /portal/ first.");

  const { data: regs, error } = await db.from("registrations")
    .select("id, first_name, last_name, course_id").limit(1);

  if (error) return say("Read registrations", false, error);
  if (!regs || !regs.length) return say("Read registrations", false, "No registrations visible.");

  target = regs[0];
  say("Ready", true, `Testing with ${target.first_name} ${target.last_name}`);
  document.getElementById("pick-cam").disabled = false;
  document.getElementById("pick-lib").disabled = false;
})();

for (const id of ["pick-cam", "pick-lib"]) {
  document.getElementById(id).addEventListener("change", (e) => run(e.target, id === "pick-cam"));
}

async function run(input, fromCamera) {
  const file = input.files[0];
  if (!file || !target) return;

  out.innerHTML = "";
  say(fromCamera ? "Camera used" : "Library used", true,
    `${file.name || "(no name)"}\ntype: ${file.type || "EMPTY — this is the problem"}\n${Math.round(file.size / 1024)} KB`);

  let blob;
  try {
    blob = await shrink(file);
    say("Shrunk on device", true, `${Math.round(blob.size / 1024)} KB jpeg`);
  } catch (err) {
    say("Shrunk on device", false, err.message || String(err));
    // Try the modern decoder, which handles more formats than <img>.
    try {
      blob = await shrinkModern(file);
      say("Shrunk using createImageBitmap instead", true,
        `${Math.round(blob.size / 1024)} KB jpeg — this is the fix`);
    } catch (err2) {
      return say("Shrunk using createImageBitmap instead", false, err2.message || String(err2));
    }
  }

  const img = document.createElement("img");
  img.src = URL.createObjectURL(blob);
  out.append(img);

  const path = `${target.course_id}/${target.id}.jpg`;
  const { error: upErr } = await db.storage
    .from("participant-photos")
    .upload(path, blob, { contentType: "image/jpeg", upsert: true });

  if (upErr) return say("Uploaded", false, upErr);
  say("Uploaded", true, "Everything worked.");
  input.value = "";
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      draw(img, img.width, img.height, resolve, reject);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("<img> could not decode this file"));
    };
    img.src = url;
  });
}

async function shrinkModern(file) {
  const bitmap = await createImageBitmap(file);
  return new Promise((resolve, reject) =>
    draw(bitmap, bitmap.width, bitmap.height, resolve, reject));
}

function draw(source, iw, ih, resolve, reject) {
  const scale = Math.min(1, 900 / Math.max(iw, ih));
  const w = Math.round(iw * scale);
  const h = Math.round(ih * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(source, 0, 0, w, h);
  canvas.toBlob(
    (b) => b ? resolve(b) : reject(new Error("canvas.toBlob returned nothing")),
    "image/jpeg", 0.82
  );
}
</script>

</body>
</html>
