<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo test</title>
<style>
  body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    margin:0;padding:1.5rem;background:#f4f3f0;color:#16181b;line-height:1.55}
  h1{font-size:1.2rem;margin:0 0 1rem}
  .step{background:#fff;border:1px solid #e0ddd7;border-radius:6px;
    padding:0.8rem 1rem;margin-bottom:0.6rem;font-size:0.9rem}
  .ok{color:#1f8a54;font-weight:650}
  .bad{color:#b3261e;font-weight:650}
  pre{white-space:pre-wrap;word-break:break-all;font-size:0.8rem;
    background:#faf9f7;padding:0.6rem;border-radius:4px;margin:0.4rem 0 0}
  input[type=file]{margin-top:1rem;font:inherit}
  img{max-width:200px;border-radius:6px;margin-top:0.8rem;display:block}
</style>
</head>
<body>

<h1>Participant photo — diagnostic</h1>
<p style="font-size:0.9rem;color:#6c7178;margin:0 0 1rem">
  This runs the same steps as the portal and reports exactly where it stops.
</p>

<div id="out"></div>
<input type="file" accept="image/*" id="pick" disabled>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const db = createClient(
  "https://yvdmazpxtpuvidlcifnq.supabase.co",
  "sb_publishable_GOrQSPEuHhbKLQMgqsATvg_rKpro7uZ"
);

const out = document.getElementById("out");
const pick = document.getElementById("pick");

function say(label, ok, detail) {
  const el = document.createElement("div");
  el.className = "step";
  el.innerHTML = `<span class="${ok ? "ok" : "bad"}">${ok ? "OK" : "FAILED"}</span> — ${label}`;
  if (detail) {
    const pre = document.createElement("pre");
    pre.textContent = typeof detail === "string" ? detail : JSON.stringify(detail, null, 2);
    el.append(pre);
  }
  out.append(el);
  return ok;
}

let target = null;

(async function setup() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return say("Signed in", false, "No session — sign into /portal/ first, then come back.");
  say("Signed in", true, session.user.email);

  const { data: staff } = await db.from("staff")
    .select("id, full_name, role").eq("id", session.user.id).maybeSingle();
  if (!staff) return say("Staff record found", false, "No row in staff for this user.");
  say("Staff record found", true, `${staff.full_name} — ${staff.role}`);

  // Find a course with at least one registration.
  const { data: regs, error } = await db.from("registrations")
    .select("id, first_name, last_name, course_id, photo_path")
    .limit(5);

  if (error) return say("Read registrations", false, error);
  if (!regs || !regs.length) return say("Read registrations", false, "No registrations visible.");

  target = regs[0];
  say("Found a participant to test with", true,
    `${target.first_name} ${target.last_name}\ncourse_id: ${target.course_id}\nregistration_id: ${target.id}`);

  pick.disabled = false;
  say("Ready — choose a photo below", true);
})();

pick.addEventListener("change", async () => {
  const file = pick.files[0];
  if (!file || !target) return;

  say("File chosen", true, `${file.name}\n${file.type || "unknown type"}\n${Math.round(file.size / 1024)} KB`);

  // ---- step 1: shrink ----
  let blob;
  try {
    blob = await shrink(file);
    say("Shrunk on device", true, `${Math.round(blob.size / 1024)} KB jpeg`);
    const img = document.createElement("img");
    img.src = URL.createObjectURL(blob);
    out.append(img);
  } catch (err) {
    return say("Shrunk on device", false, err.message || String(err));
  }

  // ---- step 2: upload ----
  const path = `${target.course_id}/${target.id}.jpg`;
  say("Upload path", true, path);

  const { error: upErr } = await db.storage
    .from("participant-photos")
    .upload(path, blob, { contentType: "image/jpeg", upsert: true });

  if (upErr) {
    return say("Uploaded to storage", false, {
      message: upErr.message,
      name: upErr.name,
      status: upErr.statusCode || upErr.status,
      error: upErr.error,
    });
  }
  say("Uploaded to storage", true);

  // ---- step 3: record it on the registration ----
  const { error: dbErr } = await db.from("registrations")
    .update({ photo_path: path, photo_taken_at: new Date().toISOString() })
    .eq("id", target.id);

  if (dbErr) {
    return say("Saved the path on the registration", false, {
      message: dbErr.message,
      code: dbErr.code,
      details: dbErr.details,
      hint: dbErr.hint,
    });
  }
  say("Saved the path on the registration", true);

  // ---- step 4: read it back ----
  const { data: signed, error: signErr } = await db.storage
    .from("participant-photos").createSignedUrl(path, 600);

  if (signErr) return say("Signed link to view it", false, signErr);
  say("Signed link to view it", true, "Everything worked.");

  const back = document.createElement("img");
  back.src = signed.signedUrl;
  out.append(back);
});

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(
        (b) => b ? resolve(b) : reject(new Error("canvas.toBlob returned nothing")),
        "image/jpeg", 0.82
      );
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("The browser could not decode this image"));
    };
    img.src = url;
  });
}
</script>

</body>
</html>
