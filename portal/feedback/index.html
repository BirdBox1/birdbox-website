<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback — BirdBox Coaching</title>
<style>
  :root {
    --ink:#16181b; --paper:#f4f3f0; --card:#fff; --shell:#0d0e10;
    --rule:#e0ddd7; --muted:#6c7178; --accent:#2f7fd0;
    --good:#1f8a54; --warn:#b4610f; --bad:#b3261e;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}

  .bar{background:var(--shell);color:#fff;padding:0.7rem 1.25rem;
    display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .bar .left{display:flex;align-items:center;gap:0.75rem;min-width:0}
  .mark{width:34px;height:34px;border-radius:4px;background:#fff;
    display:grid;place-items:center;flex:none}
  .mark img{width:26px;height:26px;object-fit:contain;display:block}
  .bar .brandname{font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;
    color:#9aa1a9;white-space:nowrap}
  .bar a{font:inherit;font-size:0.8rem;color:#cfd4d9;border:1px solid #33373c;
    padding:0.3rem 0.7rem;border-radius:3px;text-decoration:none;white-space:nowrap}
  .bar a:hover{color:#fff;border-color:#55595e}

  .wrap{max-width:56rem;margin:0 auto;padding:1.5rem 1.25rem 5rem}
  h1{font-size:1.4rem;letter-spacing:-0.02em;margin:0 0 0.2rem;font-weight:600}
  .sub{color:var(--muted);font-size:0.9rem;margin:0 0 1.25rem}
  .back{display:inline-block;font-size:0.85rem;color:var(--accent);
    text-decoration:none;margin-bottom:1rem;cursor:pointer;background:none;border:0;
    font-family:inherit;padding:0}
  .back:hover{text-decoration:underline}

  /* the participant, with their face */
  .who-head{display:flex;gap:1rem;align-items:center;margin-bottom:1.25rem}
  .who-head .face{
    flex:none;width:76px;height:76px;border-radius:8px;overflow:hidden;
    border:1px solid var(--rule);background:#eceae6;display:grid;place-items:center}
  .who-head .face img{width:100%;height:100%;object-fit:cover;display:block}
  .who-head .face .none{font-size:0.66rem;color:var(--muted);text-align:center;padding:0 0.3rem}
  .who-head h1{margin:0}
  .who-head .sub{margin:0}

  .btn{font:inherit;font-weight:600;background:var(--ink);color:#fff;border:0;
    border-radius:4px;padding:0.6rem 1.1rem;cursor:pointer}
  .btn:hover{background:#000}
  .btn[disabled]{opacity:0.45;cursor:default}
  .btn.small{font-size:0.82rem;padding:0.4rem 0.8rem}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule);font-weight:500}
  .btn.ghost:hover{background:#fff;border-color:var(--muted)}
  .btn.go{background:var(--good)}
  .btn.go:hover{background:#176e43}
  .btn.wide{width:100%}

  .card{background:var(--card);border:1px solid var(--rule);border-radius:6px;
    margin-bottom:0.7rem;overflow:hidden}
  .row{display:flex;align-items:center;gap:0.9rem;width:100%;text-align:left;
    font:inherit;background:none;border:0;padding:0.9rem 1.05rem;cursor:pointer}
  .row:hover{background:#faf9f7}
  .row .thumb{
    flex:none;width:40px;height:40px;border-radius:5px;overflow:hidden;
    border:1px solid var(--rule);background:#eceae6}
  .row .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .row .who{flex:1 1 auto;min-width:0}
  .row .name{font-weight:650}
  .row .meta{font-size:0.82rem;color:var(--muted)}

  .pill{display:inline-block;font-size:0.66rem;letter-spacing:0.09em;
    text-transform:uppercase;padding:0.16rem 0.45rem;border:1px solid var(--rule);
    border-radius:3px;color:var(--muted);white-space:nowrap}
  .pill.draft{border-color:var(--warn);color:var(--warn)}
  .pill.ok{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
  .pill.sent{border-color:var(--accent);color:var(--accent)}
  .pill.err{border-color:var(--bad);color:var(--bad);font-weight:700}

  .panel{background:var(--card);border:1px solid var(--rule);border-radius:6px;
    padding:1.25rem;margin-bottom:1rem}
  .panel h3{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--muted);margin:0 0 0.8rem;font-weight:600}

  label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:0.3rem}
  .hint{font-weight:400;color:var(--muted);font-size:0.78rem}
  input[type=text],textarea{width:100%;font:inherit;padding:0.55rem 0.65rem;
    border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
  textarea{min-height:24rem;resize:vertical;line-height:1.6}
  .field{margin-bottom:1rem}

  .notes{background:#fbfaf8;border:1px solid var(--rule);border-radius:5px;
    padding:0.8rem 0.9rem;font-size:0.88rem;max-height:16rem;overflow-y:auto}
  .notes .n{border-left:2px solid var(--rule);padding-left:0.7rem;margin-bottom:0.7rem}
  .notes .n:last-child{margin-bottom:0}
  .notes .a{font-size:0.75rem;color:var(--muted);font-weight:650}
  .notes .b{white-space:pre-wrap}

  .msg{font-size:0.85rem;margin-top:0.9rem;min-height:1.2em}
  .msg.err{color:var(--bad)}
  .msg.ok{color:var(--good)}
  .empty{background:var(--card);border:1px dashed var(--rule);border-radius:6px;
    padding:2rem 1.25rem;text-align:center;color:var(--muted);font-size:0.9rem}
  .counts{font-size:0.85rem;color:var(--muted);margin-bottom:1rem}
  .sticky{position:sticky;bottom:0;background:var(--paper);
    padding:0.9rem 0;border-top:1px solid var(--rule);margin-top:1.25rem}

  .spin{display:inline-block;width:0.85rem;height:0.85rem;margin-right:0.45rem;
    border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;
    animation:sp 0.7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>

<div class="bar">
  <span class="left">
    <span class="mark"><img src="/brand/birdBox.png" alt=""></span>
    <span class="brandname">Feedback</span>
  </span>
  <a href="/portal/">← Portal</a>
</div>

<div class="wrap">
  <div id="loading"><p class="sub">Loading…</p></div>

  <section id="view-courses" class="hidden">
    <h1>Feedback</h1>
    <p class="sub">Courses you are lead coach on.</p>
    <div id="courselist"></div>
  </section>

  <section id="view-people" class="hidden">
    <button class="back" id="back-courses" type="button">← All courses</button>
    <h1 id="c-title"></h1>
    <p class="sub" id="c-meta"></p>
    <p class="counts" id="c-counts"></p>
    <div id="peoplelist"></div>

    <div class="sticky">
      <button class="btn go wide" id="sendall" type="button" disabled>Send all approved emails</button>
      <p class="msg" id="send-msg"></p>
    </div>
  </section>

  <section id="view-draft" class="hidden">
    <button class="back" id="back-people" type="button">← All participants</button>

    <div class="who-head">
      <div class="face" id="p-face"><span class="none">No photo</span></div>
      <div>
        <h1 id="p-name"></h1>
        <p class="sub" id="p-meta"></p>
      </div>
    </div>

    <div class="panel">
      <h3>Coach notes</h3>
      <div class="notes" id="p-notes"></div>
      <div style="margin-top:0.9rem;display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">
        <button class="btn small" id="generate" type="button">Write the draft</button>
        <span class="hint" id="gen-hint"></span>
      </div>
      <p class="msg" id="gen-msg"></p>
    </div>

    <div class="panel hidden" id="draftpanel">
      <h3>The email</h3>
      <div class="field">
        <label for="d-subject">Subject</label>
        <input id="d-subject" type="text">
      </div>
      <div class="field">
        <label for="d-body">Body
          <span class="hint">edit freely — this is exactly what gets sent, nothing is added</span>
        </label>
        <textarea id="d-body"></textarea>
      </div>

      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">
        <button class="btn small" id="save" type="button">Save</button>
        <button class="btn small go" id="approve" type="button">Mark as checked</button>
        <button class="btn ghost small" id="unapprove" type="button">Unmark</button>
      </div>
      <p class="msg" id="d-msg"></p>
    </div>
  </section>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://yvdmazpxtpuvidlcifnq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_GOrQSPEuHhbKLQMgqsATvg_rKpro7uZ";
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $ = (id) => document.getElementById(id);
const show = (n) => {
  for (const v of ["courses", "people", "draft"]) {
    $("view-" + v).classList.toggle("hidden", v !== n);
  }
  $("loading").classList.add("hidden");
  window.scrollTo({ top: 0 });
};

// The columns a course needs on this page, in one place so the list
// and the direct link cannot fetch different shapes of the same row.
const COURSE_COLS =
  "id, brand, level, type, title, city, country, starts_at, language, currency, status, archived";

let me = null;
let course = null;
let people = [];
let drafts = {};
let photoUrls = {};
let current = null;
let watching = null;

// Which brand, type and level combinations have a feedback manual.
// The same table the drafting function reads, so a course cannot
// appear here and then fail the moment somebody presses the button.
// TCC Level 2 has no row: its certificate follows the online exam and
// no feedback email is written for it.
let manualKeys = new Set();

const manualKey = (c) =>
  `${c.brand}:${c.type}:${String(c.level || "").replace(/\D/g, "")}`;

const hasManual = (c) => manualKeys.has(manualKey(c));

async function loadManualKeys() {
  const { data, error } = await db
    .from("feedback_manuals")
    .select("brand, type, level, active")
    .eq("active", true);

  if (error) {
    console.error("Could not load feedback manuals:", error.message);
    // Better to show everything than to empty the page on a lookup
    // failure — the drafting function refuses on its own anyway.
    manualKeys = null;
    return;
  }

  manualKeys = new Set(
    (data || []).map((r) => `${r.brand}:${r.type}:${String(r.level || "").replace(/\D/g, "")}`)
  );
}

// A null set means the lookup failed, so nothing is filtered out.
const feedbackApplies = (c) => manualKeys === null || hasManual(c);

const fmtDate = (iso) => iso
  ? new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })
  : "";

start();

async function start() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = "/portal/"; return; }

  const { data: staff } = await db.from("staff")
    .select("id, full_name, email, role, active")
    .eq("id", session.user.id).maybeSingle();

  if (!staff || !staff.active) { location.href = "/portal/"; return; }
  me = staff;

  await loadManualKeys();

  // Arriving from a course in the portal: open that course straight
  // away rather than making somebody find it again in a list they
  // have just come from.
  const wanted = new URLSearchParams(location.search).get("course");
  if (wanted && await openCourseById(wanted)) return;

  await loadCourses();
}

// Returns true if it opened. Anything that does not resolve — a bad
// id, a course this person does not lead, a course type that does not
// do feedback — falls back to the list rather than showing an error,
// because the list is where they were going anyway.
async function openCourseById(id) {
  const { data: c } = await db.from("courses")
    .select(COURSE_COLS).eq("id", id).maybeSingle();
  if (!c) return false;
  if (!feedbackApplies(c)) return false;

  if (me.role !== "admin") {
    const { data: role } = await db.from("course_staff")
      .select("role").eq("course_id", id).eq("staff_id", me.id).maybeSingle();
    if (!role || role.role !== "lead_coach") return false;
  }

  // Drop the parameter once it has been used, so pressing back to the
  // list and reloading does not bounce straight back in here.
  history.replaceState(null, "", location.pathname);

  await openCourse(c);
  return true;
}

/* ---------------- courses ---------------- */

async function loadCourses() {
  stopWatching();
  show("courses");
  const list = $("courselist");
  list.innerHTML = '<p class="empty">Loading…</p>';

  let rows = [];
  if (me.role === "admin") {
    const { data } = await db.from("courses").select(COURSE_COLS)
      .order("starts_at", { ascending: false });
    rows = data || [];
  } else {
    const { data } = await db.from("course_staff")
      .select(`role, courses (${COURSE_COLS})`)
      .eq("staff_id", me.id)
      .eq("role", "lead_coach");
    rows = (data || []).map((r) => r.courses).filter(Boolean);
    rows.sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at));
  }

  // Only course types that actually have a manual. Listing one that
  // does not would offer a button that could only ever fail.
  const skipped = rows.length;
  rows = rows.filter(feedbackApplies);
  const hidden = skipped - rows.length;

  if (!rows.length) {
    list.innerHTML = '<p class="empty">No courses to write feedback for.</p>';
    return;
  }

  const { data: ds } = await db.from("feedback_drafts")
    .select("course_id, status")
    .in("course_id", rows.map((r) => r.id));

  const tally = {};
  for (const d of ds || []) {
    const t = tally[d.course_id] = tally[d.course_id] || {};
    t[d.status] = (t[d.status] || 0) + 1;
  }

  list.innerHTML = "";
  for (const c of rows) {
    const t = tally[c.id] || {};
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<button class="row" type="button">
      <span class="who"><span class="name"></span><span class="meta"></span></span>
      <span class="pill"></span></button>`;
    el.querySelector(".name").textContent = c.title;
    el.querySelector(".meta").textContent =
      [fmtDate(c.starts_at), [c.city, c.country].filter(Boolean).join(", ")]
        .filter(Boolean).join(" · ");

    const pill = el.querySelector(".pill");
    if (t.sent && !t.draft && !t.approved) { pill.textContent = "all sent"; pill.className = "pill sent"; }
    else if (t.approved) { pill.textContent = `${t.approved} checked`; pill.className = "pill ok"; }
    else if (t.draft) { pill.textContent = `${t.draft} drafted`; pill.className = "pill draft"; }
    else if (t.failed) { pill.textContent = "failed"; pill.className = "pill err"; }
    else { pill.textContent = "not started"; pill.className = "pill"; }

    el.querySelector(".row").addEventListener("click", () => openCourse(c));
    list.append(el);
  }

  // Said plainly, so a course missing from the list reads as a
  // decision rather than a bug worth chasing.
  if (hidden) {
    const note = document.createElement("p");
    note.className = "sub";
    note.style.marginTop = "1rem";
    note.textContent =
      `${hidden} course${hidden === 1 ? " is" : "s are"} not shown — ` +
      "those course types do not have feedback emails.";
    list.append(note);
  }
}

/* ---------------- participants ---------------- */

async function openCourse(c) {
  stopWatching();
  course = c;
  show("people");
  $("c-title").textContent = c.title;
  $("c-meta").textContent =
    [fmtDate(c.starts_at), [c.city, c.country].filter(Boolean).join(", ")]
      .filter(Boolean).join(" · ");
  $("send-msg").textContent = "";
  $("peoplelist").innerHTML = '<p class="empty">Loading…</p>';

  const { data: regs } = await db.from("registrations")
    .select("id, first_name, last_name, email, payment_status, feedback_language, photo_path")
    .eq("course_id", c.id)
    .order("last_name");

  people = (regs || []).filter(
    (r) => r.payment_status !== "refunded" && r.payment_status !== "failed"
  );

  await refreshDrafts();
  await loadPhotos();

  const { data: notes } = await db.from("participant_notes")
    .select("registration_id").eq("course_id", c.id);
  const noteCount = {};
  for (const n of notes || []) {
    noteCount[n.registration_id] = (noteCount[n.registration_id] || 0) + 1;
  }

  renderPeople(noteCount);
}

async function refreshDrafts() {
  const { data: ds } = await db.from("feedback_drafts")
    .select("*").eq("course_id", course.id);
  drafts = {};
  for (const d of ds || []) drafts[d.registration_id] = d;
}

// One signed link per photo, valid for the session. The bucket is
// private, so these cannot be shared or guessed.
async function loadPhotos() {
  photoUrls = {};
  const paths = people.map((p) => p.photo_path).filter(Boolean);
  if (!paths.length) return;

  const { data } = await db.storage
    .from("participant-photos")
    .createSignedUrls(paths, 3600);

  for (const item of data || []) {
    if (item.signedUrl && !item.error) photoUrls[item.path] = item.signedUrl;
  }
}

function renderPeople(noteCount) {
  const list = $("peoplelist");
  if (!people.length) {
    list.innerHTML = '<p class="empty">Nobody on this course.</p>';
    $("sendall").disabled = true;
    return;
  }

  list.innerHTML = "";
  let approved = 0, sent = 0, drafted = 0, missing = 0;

  for (const r of people) {
    const d = drafts[r.id];
    const n = noteCount[r.id] || 0;
    if (!n) missing++;
    if (d?.status === "approved") approved++;
    if (d?.status === "sent") sent++;
    if (d?.status === "draft") drafted++;

    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<button class="row" type="button">
      <span class="thumb"></span>
      <span class="who"><span class="name"></span><span class="meta"></span></span>
      <span class="pill"></span></button>`;

    const thumb = el.querySelector(".thumb");
    const url = r.photo_path && photoUrls[r.photo_path];
    if (url) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "";
      thumb.append(img);
    }

    el.querySelector(".name").textContent = `${r.first_name} ${r.last_name}`;
    el.querySelector(".meta").textContent =
      `${n} note${n === 1 ? "" : "s"}` +
      (r.feedback_language && r.feedback_language !== course.language
        ? ` · feedback in ${r.feedback_language}` : "");

    const pill = el.querySelector(".pill");
    if (d?.status === "sent") { pill.textContent = "sent"; pill.className = "pill sent"; }
    else if (d?.status === "failed") { pill.textContent = "failed"; pill.className = "pill err"; }
    else if (d?.status === "approved") { pill.textContent = "checked"; pill.className = "pill ok"; }
    else if (d?.status === "draft") { pill.textContent = "needs checking"; pill.className = "pill draft"; }
    else if (!n) { pill.textContent = "no notes"; pill.className = "pill"; }
    else { pill.textContent = "not written"; pill.className = "pill"; }

    el.querySelector(".row").addEventListener("click", () => openDraft(r));
    list.append(el);
  }

  $("c-counts").textContent =
    `${people.length} participant${people.length === 1 ? "" : "s"} · ` +
    `${drafted} to check · ${approved} checked · ${sent} sent` +
    (missing ? ` · ${missing} with no notes` : "");

  const btn = $("sendall");
  btn.disabled = !approved;
  btn.textContent = approved
    ? `Send ${approved} checked email${approved === 1 ? "" : "s"}`
    : sent === people.length ? "All sent" : "Nothing checked yet";
}

/* ---------------- one draft ---------------- */

async function openDraft(reg) {
  stopWatching();
  show("draft");
  $("p-name").textContent = `${reg.first_name} ${reg.last_name}`;
  $("p-meta").textContent = reg.email;
  $("gen-msg").textContent = "";
  $("gen-msg").className = "msg";
  $("d-msg").textContent = "";

  // The face, so the coach knows who they are writing about.
  const face = $("p-face");
  const url = reg.photo_path && photoUrls[reg.photo_path];
  face.innerHTML = url ? "" : '<span class="none">No photo</span>';
  if (url) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = `${reg.first_name} ${reg.last_name}`;
    face.append(img);
  }

  const { data: notes } = await db.from("participant_notes")
    .select("body, created_at, staff ( full_name )")
    .eq("registration_id", reg.id)
    .order("created_at");

  const box = $("p-notes");
  box.innerHTML = "";
  if (!notes || !notes.length) {
    box.innerHTML = '<p style="margin:0;color:var(--muted)">Nothing written for this participant.</p>';
  } else {
    for (const n of notes) {
      const el = document.createElement("div");
      el.className = "n";
      el.innerHTML = '<div class="a"></div><div class="b"></div>';
      el.querySelector(".a").textContent = n.staff?.full_name || "Coach";
      el.querySelector(".b").textContent = n.body;
      box.append(el);
    }
  }

  current = { reg, draft: drafts[reg.id] || null, notes: notes || [] };

  $("generate").disabled = !(notes && notes.length);
  $("gen-hint").textContent = notes && notes.length ? "" : "Add notes for this participant first.";

  if (current.draft?.status === "failed") {
    $("gen-msg").className = "msg err";
    $("gen-msg").textContent = current.draft.gen_error || "The last attempt failed.";
  } else if (current.draft?.gen_error) {
    $("gen-msg").className = "msg";
    $("gen-msg").textContent = current.draft.gen_error;
  }

  renderDraft();
}

function renderDraft() {
  const d = current.draft;
  const usable = d && d.status !== "failed" && d.body;
  $("draftpanel").classList.toggle("hidden", !usable);
  $("generate").textContent = usable ? "Rewrite from notes" : "Write the draft";
  if (!usable) return;

  $("d-subject").value = d.subject || "";
  $("d-body").value = d.body || "";

  const sent = d.status === "sent";
  for (const id of ["save", "approve", "d-subject", "d-body"]) $(id).disabled = sent;
  $("approve").disabled = sent || d.status === "approved";
  $("unapprove").disabled = sent || d.status !== "approved";
  $("generate").disabled = sent;

  $("d-msg").className = "msg";
  $("d-msg").textContent = sent
    ? "This email has been sent and can no longer be changed."
    : d.status === "approved" ? "Checked and ready to send." : "";
}

/* ---------------- writing ---------------- */

function stopWatching() {
  if (watching) { clearInterval(watching); watching = null; }
}

async function generate() {
  const msg = $("gen-msg");
  const reg = current.reg;
  const before = current.draft?.generated_at || null;

  $("generate").disabled = true;
  msg.className = "msg";
  msg.innerHTML = '<span class="spin"></span>Writing — this usually takes under a minute…';

  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session) throw new Error("Your session has expired — sign in again.");

    const res = await fetch("/.netlify/functions/feedback-draft-background", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + session.access_token,
      },
      body: JSON.stringify({ registrationId: reg.id }),
    });

    if (res.status !== 202 && !res.ok) {
      throw new Error("Could not start writing. Try again.");
    }
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = err.message;
    $("generate").disabled = false;
    return;
  }

  let waited = 0;
  stopWatching();
  watching = setInterval(async () => {
    waited += 3;

    const { data: d } = await db.from("feedback_drafts")
      .select("*").eq("registration_id", reg.id).maybeSingle();

    const changed = d && (d.generated_at !== before || d.status === "failed");
    if (!changed) {
      if (waited >= 180) {
        stopWatching();
        msg.className = "msg err";
        msg.textContent = "This is taking longer than expected. Check back in a minute.";
        $("generate").disabled = false;
      }
      return;
    }

    stopWatching();
    current.draft = d;
    drafts[reg.id] = d;
    $("generate").disabled = false;

    if (d.status === "failed") {
      msg.className = "msg err";
      msg.textContent = d.gen_error || "The draft could not be written.";
    } else {
      msg.className = "msg ok";
      msg.textContent = d.gen_error || "Written. Read it through before marking it checked.";
    }
    renderDraft();
  }, 3000);
}

$("generate").addEventListener("click", () => {
  if (current.draft?.body &&
      !window.confirm("Rewrite this from the notes? Your edits will be lost.")) return;
  generate();
});

/* ---------------- saving ---------------- */

// `blocks` is deliberately not written here. It is a record of which
// passages the drafting model covered, and the coach editing the text
// by hand does not change what that record says.
async function saveDraft(patch, note) {
  const msg = $("d-msg");
  msg.className = "msg";
  msg.textContent = "Saving…";

  const { data, error } = await db.from("feedback_drafts")
    .update({
      subject: $("d-subject").value.trim(),
      body: $("d-body").value,
      updated_at: new Date().toISOString(),
      ...patch,
    })
    .eq("id", current.draft.id)
    .select()
    .single();

  if (error) {
    msg.className = "msg err";
    msg.textContent = "Could not save: " + error.message;
    return false;
  }
  current.draft = data;
  drafts[current.reg.id] = data;
  msg.className = "msg ok";
  msg.textContent = note || "Saved.";
  renderDraft();
  return true;
}

$("save").addEventListener("click", () => saveDraft({}));

$("approve").addEventListener("click", async () => {
  if (!$("d-body").value.trim()) {
    $("d-msg").className = "msg err";
    $("d-msg").textContent = "There is nothing to send.";
    return;
  }
  await saveDraft({
    status: "approved",
    approved_at: new Date().toISOString(),
    approved_by: me.id,
  }, "Checked. It will go out with the next send.");
});

$("unapprove").addEventListener("click", () =>
  saveDraft({ status: "draft", approved_at: null, approved_by: null }, "Unmarked.")
);

$("back-courses").addEventListener("click", loadCourses);
$("back-people").addEventListener("click", () => openCourse(course));

/* ---------------- send them all ---------------- */

$("sendall").addEventListener("click", async () => {
  const ready = people.filter((r) => drafts[r.id]?.status === "approved");
  if (!ready.length) return;

  if (!window.confirm(
    `Send ${ready.length} feedback email${ready.length === 1 ? "" : "s"}?\n\n` +
    "Each participant receives only their own email. This cannot be undone."
  )) return;

  const btn = $("sendall");
  const msg = $("send-msg");
  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "Sending…";

  try {
    const { data: { session } } = await db.auth.getSession();
    const res = await fetch("/.netlify/functions/feedback-send", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + session.access_token,
      },
      body: JSON.stringify({ courseId: course.id }),
    });
    const r = await res.json();
    if (!res.ok || r.error) throw new Error(r.error || "That did not work.");

    msg.className = r.failed ? "msg err" : "msg ok";
    msg.textContent = r.failed
      ? `${r.sent} sent, ${r.failed} failed. The failures are marked in the list.`
      : `${r.sent} email${r.sent === 1 ? "" : "s"} sent as ${r.sentAs || "you"}.`;
    await openCourse(course);
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = err.message;
    btn.disabled = false;
  }
});
</script>
