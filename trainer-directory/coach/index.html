<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirdBox Coach | Trainer Directory</title>
<meta name="description" content="A coach in the BirdBox Trainer Directory, with the BirdBox courses they have completed.">
<link rel="stylesheet" href="/trainer-directory/directory.css">
<style>
  .cp { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; margin-top: 22px; align-items: start; }
  .cp-side { border: 1px solid var(--line); background: var(--panel); position: sticky; top: 14px; }
  .cp-side .td-avatar { font-size: 64px; }
  .cp-side__body { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .cp-link {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line);
    color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; overflow: hidden;
  }
  .cp-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-link:hover { border-color: var(--tcc); }
  .cp-link svg { flex: none; color: var(--accentText); }

  .cp-contact { width: 100%; }
  .cp-form { border: 1px solid var(--line); background: var(--panel); padding: 22px 24px; margin-top: 14px; scroll-margin-top: 14px; }
  .cp-form h2 { font-size: 15px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 6px; }
  .cp-form > p { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0 0 16px; }
  .cp-form label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .cp-form input, .cp-form textarea, .cp-form select { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 0; margin-bottom: 12px; }
  .cp-form textarea { min-height: 130px; resize: vertical; line-height: 1.55; }
  .cp-form input:focus, .cp-form textarea:focus, .cp-form select:focus { outline: none; border-color: var(--tcc); }
  .cp-form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .cp-form .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .cp-form small { display: block; font-size: 12px; color: var(--muted); margin: -4px 0 14px; line-height: 1.5; }
  .cp-msg { font-size: 14px; margin: 12px 0 0; line-height: 1.5; }
  .cp-msg.err { color: var(--bad); } .cp-msg.ok { color: var(--good); }
  @media (max-width: 520px) { .cp-form .two { grid-template-columns: 1fr; } .cp-form { padding: 18px 16px; } }
  .cp-main { min-width: 0; }
  .cp-mine { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 22px;
    padding: 14px 18px; border: 1px solid var(--tcc); background: rgba(79,168,222,.08); color: var(--ink); text-decoration: none; font-size: 14px; }
  .cp-mine__links { display: flex; gap: 18px; }
  .cp-mine a { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accentText); text-decoration: none; }
  .cp-mine a:hover { color: #fff; }
  .cp-head { border: 1px solid var(--line); background: var(--panel); padding: 28px 30px; }
  .cp-name { font-size: clamp(28px, 4vw, 44px); line-height: 1.05; font-weight: 800; text-transform: uppercase; letter-spacing: -.015em; margin: 0 0 8px; }
  .cp-headline { font-size: 17px; color: var(--accentText); margin: 0 0 14px; font-weight: 600; }
  .cp-quals { font-size: 14px; color: var(--soft); margin: -6px 0 14px; letter-spacing: .02em; }
  .cp-facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .cp-fact { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #ADA6A8; border: 1px solid var(--line); padding: 7px 12px; }
  .cp-bio { font-size: 16px; line-height: 1.7; color: var(--soft); margin: 0; white-space: pre-line; max-width: 70ch; }

  .cp-courses { border: 1px solid var(--line); background: var(--panel); margin-top: 14px; }
  .cp-courses__head { padding: 20px 30px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .cp-courses__head h2 { font-size: 15px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
  .cp-courses__head span { font-size: 13px; color: var(--muted); }
  .cp-course { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 18px 30px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--b, var(--line)); }
  .cp-course:last-child { border-bottom: 0; }
  .cp-course img { width: 56px; height: 56px; object-fit: contain; }
  .cp-course h3 { font-size: 16px; margin: 0 0 3px; }
  .cp-course p { margin: 0; font-size: 13px; color: var(--muted); }
  .cp-course p.cp-tag { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--t-tcc); margin: 0 0 3px; }
  .cp-ok { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--good); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

  .cp-missing { border: 1px dashed var(--line); padding: 40px 24px; text-align: center; color: var(--muted); margin-top: 22px; line-height: 1.6; }
  .cp-missing strong { color: var(--ink); display: block; font-size: 18px; margin-bottom: 6px; }

  @media (max-width: 860px) {
    .cp { grid-template-columns: 1fr; }
    .cp-side { position: static; display: grid; grid-template-columns: 140px minmax(0, 1fr); }
    .cp-side .td-avatar { font-size: 40px; }
    .cp-head { padding: 22px 18px; }
    .cp-courses__head, .cp-course { padding-left: 18px; padding-right: 18px; }
  }
  @media (max-width: 520px) {
    .cp-side { grid-template-columns: 1fr; }
    .cp-side .td-avatar { max-height: 340px; }
    .cp-course { grid-template-columns: 40px minmax(0, 1fr); gap: 12px; }
    .cp-course img { width: 40px; height: 40px; }
    .cp-ok { grid-column: 2; }
  }
</style>
<link rel="icon" href="/favicon-birdbox.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-birdbox-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon-birdbox.png">
</head>
<body>

<nav class="bb-topbar">
  <a href="/shop/">Shop</a>
  <a href="/blog">Blog</a>
  <a href="/trainer-directory">Trainer Directory</a>
  <a href="/about">About</a>
</nav>

<div class="bb-backbar">
  <a class="bb-back" href="/trainer-directory/#directory">&larr; All coaches</a>
</div>

<main class="bb-wrap" id="root">
  <p class="td-lede" style="margin-top:30px">Loading…</p>
</main>

<footer class="bb-footer">
  &copy; BirdBox Coaching Ltd &mdash; Trading as BirdBox Coaching, The Gymnastics Course, The Endurance Course, and The Coaches Course.
  <a class="bb-footer__staff" href="/learn/directory/">Is this you? Edit your listing</a>
</footer>

<script src="/nav.js"></script>
<script type="module">
import { BRANDS, esc, badges, place, avatar, monthYear } from "/trainer-directory/directory.js";

const root = document.getElementById("root");
const fromPath = decodeURIComponent((location.pathname.match(/\/trainer-directory\/coach\/([^/]+)/) || [])[1] || "");
const slug = (fromPath !== "index.html" && fromPath) || new URLSearchParams(location.search).get("c") || "";

const ICON = {
  ig: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  web: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  fb: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg>',
  tw: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M20 4 4 20"/></svg>',
  li: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>',
  mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14"/><path d="m3 6 9 7 9-7"/></svg>',
};

function missing() {
  root.innerHTML = `<div class="cp-missing"><strong>We could not find that coach.</strong>They may have changed their listing or taken it down. <a href="/trainer-directory/#directory">Search the directory</a>.</div>`;
}

function courseRow(c) {
  const b = BRANDS[c.brand] || BRANDS.birdbox;
  const bits = [c.kind === "online" ? "Online" : c.kind === "workshop" ? "Workshop" : "In person", monthYear(c.date), c.place].filter(Boolean);
  return `<div class="cp-course" style="--b:var(--b-${esc(c.brand)})">
    <img src="${b.mark}" alt="" onerror="this.src='/brand/birdbox-mark.png'">
    <div><h3>${esc(c.title)}</h3>${c.tagline ? `<p class="cp-tag">${esc(c.tagline)}</p>` : ""}<p>${esc(bits.join(" · "))}</p></div>
    <span class="cp-ok" title="${c.verified === "certificate" ? "Certificate issued by BirdBox Coaching" : c.verified === "records" ? "On BirdBox Coaching's seminar records" : "Checked by the BirdBox team"}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>
      ${c.verified === "certificate" ? "Certified" : "Verified"}</span>
  </div>`;
}

async function load() {
  if (!slug) return missing();
  let c;
  try {
    const r = await fetch("/.netlify/functions/directory-public?slug=" + encodeURIComponent(slug));
    if (!r.ok) return missing();
    c = (await r.json()).coach;
  } catch (e) { return missing(); }
  if (!c) return missing();

  document.title = `${c.name} | BirdBox Trainer Directory`;
  const desc = `${c.name}${place(c) ? ", " + place(c) : ""}. BirdBox courses: ${[...new Set(c.courses.map((x) => x.title))].join(", ")}.`;
  document.querySelector('meta[name="description"]').setAttribute("content", desc);

  const links = [];
  if (c.instagram) links.push(`<a class="cp-link" href="https://instagram.com/${encodeURIComponent(c.instagram)}" target="_blank" rel="noopener">${ICON.ig}<span>@${esc(c.instagram)}</span></a>`);
  if (c.website) links.push(`<a class="cp-link" href="${esc(c.website)}" target="_blank" rel="noopener nofollow">${ICON.web}<span>${esc(c.website.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))}</span></a>`);
  const short = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  if (c.facebook) links.push(`<a class="cp-link" href="${esc(c.facebook)}" target="_blank" rel="noopener nofollow">${ICON.fb}<span>${esc(short(c.facebook))}</span></a>`);
  if (c.linkedin) links.push(`<a class="cp-link" href="${esc(c.linkedin)}" target="_blank" rel="noopener nofollow">${ICON.li}<span>${esc(short(c.linkedin))}</span></a>`);
  if (c.twitter) links.push(`<a class="cp-link" href="${esc(c.twitter)}" target="_blank" rel="noopener nofollow">${ICON.tw}<span>${esc(short(c.twitter))}</span></a>`);
  const firstName = esc(c.name.split(" ")[0]);

  const facts = [];
  if (c.gym) facts.push(c.gym);
  if (place(c)) facts.push(place(c));
  if (c.online) facts.push("Coaches online");

  root.innerHTML = `<div class="cp">
    <aside class="cp-side">
      ${avatar(c)}
      <div class="cp-side__body">
        <a class="td-btn cp-contact" href="#contact">${ICON.mail} Contact ${firstName}</a>
        ${links.join("")}
      </div>
    </aside>
    <div class="cp-main">
      <section class="cp-head">
        <p class="td-label">BirdBox coach</p>
        <h1 class="cp-name">${esc(c.name)}</h1>
        ${c.headline ? `<p class="cp-headline">${esc(c.headline)}</p>` : ""}
        ${c.qualifications ? `<p class="cp-quals">${esc(c.qualifications)}</p>` : ""}
        <div class="cp-facts">${facts.map((f) => `<span class="cp-fact">${esc(f)}</span>`).join("")}</div>
        <div class="td-badges" style="margin-bottom:${c.bio ? "20px" : "0"}">${badges(c.courses)}</div>
        ${c.bio ? `<p class="cp-bio">${esc(c.bio)}</p>` : ""}
      </section>
      <section class="cp-courses">
        <div class="cp-courses__head"><h2>BirdBox courses completed</h2><span>Checked against our records</span></div>
        ${c.courses.map(courseRow).join("")}
      </section>
      <form class="cp-form" id="contact" novalidate>
        <h2>Contact ${firstName}</h2>
        <p>Send ${firstName} a message. We email it to them with your details, and they reply to you directly.</p>
        <div class="two">
          <div><label for="c-name">Your name</label><input id="c-name" autocomplete="name" maxlength="80" required></div>
          <div><label for="c-email">Your email</label><input id="c-email" type="email" autocomplete="email" maxlength="254" required></div>
        </div>
        <div class="two">
          <div><label for="c-phone">Phone (optional)</label><input id="c-phone" type="tel" autocomplete="tel" maxlength="40"></div>
          <div><label for="c-for">Looking for</label>
            <select id="c-for" required>
              <option value="">Choose one</option>
              <option value="personal">Coaching for myself</option>
              <option value="online">Online coaching</option>
              <option value="join">Joining a gym</option>
              <option value="other">Something else</option>
            </select></div>
        </div>
        <label for="c-msg">Message</label><textarea id="c-msg" maxlength="1000" required placeholder="What would you like help with? Where are you based?"></textarea>
        <div class="hp" aria-hidden="true"><label for="c-co">Company</label><input id="c-co" tabindex="-1" autocomplete="off"></div>
        <small>Please no links. This form is for people looking for a coach; sales and marketing messages are not passed on. By sending, you agree we pass your name, email, phone and message to ${firstName} so they can reply.</small>
        <button class="td-btn" type="submit" id="c-go">Send request</button>
        <div class="cp-msg" id="c-msg-out" role="status"></div>
      </form>
    </div>
  </div>`;
  wireContact(c.slug);
  showEditIfMine(c.slug);
}

// A coach looking at their own page gets a button straight to editing it.
// Only checked when someone is logged in; visitors never call this.
async function showEditIfMine(coachSlug) {
  try {
    const key = Object.keys(localStorage).find((k) => /^sb-.*-auth-token$/.test(k));
    const token = key && JSON.parse(localStorage.getItem(key))?.access_token;
    if (!token) return;
    const r = await fetch("/.netlify/functions/directory-me", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) return;
    const d = await r.json();
    if (d.profile?.slug !== coachSlug) return;
    const bar = document.createElement("div");
    bar.className = "cp-mine";
    bar.innerHTML = '<span>This is your listing. Visitors see it exactly like this.</span>' +
      '<span class="cp-mine__links"><a href="/learn/directory/">Edit my listing &rarr;</a><a href="/learn/">My courses &rarr;</a></span>';
    root.prepend(bar);
  } catch (e) {}
}

function wireContact(coachSlug) {
  const f = document.getElementById("contact");
  const out = document.getElementById("c-msg-out");
  const val = (id) => document.getElementById(id).value;
  // How long the form has been open: bots fill it in instantly.
  const opened = Date.now();
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("c-go");
    btn.disabled = true; out.className = "cp-msg"; out.textContent = "Sending…";
    try {
      const r = await fetch("/.netlify/functions/directory-contact", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug: coachSlug, name: val("c-name"), email: val("c-email"), phone: val("c-phone"), message: val("c-msg"), looking_for: val("c-for"), company: val("c-co"), t: Date.now() - opened }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "That did not send. Try again.");
      f.querySelectorAll("input, textarea, select").forEach((x) => { x.value = ""; });
      out.className = "cp-msg ok";
      out.textContent = "Sent. The coach has your details and will reply by email if they can help.";
    } catch (err) {
      out.className = "cp-msg err"; out.textContent = err.message;
    }
    btn.disabled = false;
  });
}

load();
</script>
</body>
</html>
